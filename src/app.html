  qBox.innerHTML=`<div class="label">${ms?'Al-Quran':'Qur\'an'}</div>${qv}`+res.q.map(w=>{ const a=A[w.g]; let ar='', tr='';
    for(let g=w.g;g<=w.e;g++){ ar+=(ar?' ':'')+A[g][2]; tr+=(tr?' ':'')+(st.lang==='ms'?A[g][6]:A[g][7]); }
    return `<button class="ck-r" data-ckq="${w.g}"><span class="ck-h"><b>${esc(ref(w.g,w.e))}</b><small>${res.isAr&&part(w)?(ms?`Sebahagian ayat ini (${ckPct(w.qc)} teks itu ada dalam ayat ini)`:`Part of this ayah (${ckPct(w.qc)} of the text is in this ayah)`):ckPct(w.p)+' '+(res.isAr?(ms?'daripada ayat ini sepadan dengan teks':'of this ayah matches the text'):(ms?'perkataan penting sama dengan terjemahan':'of the important words match the translation'))}</small></span>
      <span dir="rtl" lang="ar" class="ck-ar">${esc(ar.length>420?ar.slice(0,420)+'…':ar)}</span><span class="note">${esc(tr.length>300?tr.slice(0,300)+'…':tr)}</span><span class="ck-go">${ms?'Buka ayat ›':'Open the ayah ›'}</span></button>`; }).join('');
  const nH=res.h.length;
  let hv;
  if(!res.hDone) hv=`<p class="note" id="ckHP">${ms?'Menyemak kitab hadis…':'Checking the hadith books…'}</p>`;
  else if(res.fail===-1) hv=`<p class="note">${ms?'Kitab hadis tidak dapat dimuatkan (tiada internet).':'The hadith books could not be loaded (no internet).'}</p>`;
  else if(res.short) hv=`<p class="note">${ms?'Teks terlalu pendek untuk disemak dengan kitab hadis.':'The text is too short to check against the hadith books.'}</p>`;
  else if(!nH) hv=`<div class="ck-v ck-no">${ms?'Tidak dijumpai dalam lapan kitab hadis dalam aplikasi ini.':'Not found in the eight hadith books in this app.'}</div><p class="note">${ms?'Ini bukan bukti ia palsu: ia mungkin ada dalam kitab lain atau dengan lafaz lain. Tanya ulama yang berkelayakan.':'This is not proof that it is fabricated: it may be in other books or in other words. Ask a qualified scholar.'}</p>`;
  else if(!res.h.some(r=>r.sc.qc>=0.8)) hv=`<div class="ck-v ck-mid">${ms?'Hanya sebahagian teks itu sepadan dengan hadis':'Only part of the text matches a hadith'}</div><p class="note">${ms?'Bahagian yang lain tidak dijumpai dalam lapan kitab ini. Bandingkan lafaznya dan lihat penilaian (darjat).':'The rest was not found in these eight books. Compare the wording and see the grading.'}</p>`;
  else hv=`<div class="ck-v ck-ok">${ms?`${nH} hadis yang hampir sama dijumpai`:`${nH} similar hadith found`}</div><p class="note">${ms?'Lihat penilaian (darjat) setiap satu. Hadis yang sama boleh ada dalam beberapa kitab.':'See the grading of each. The same hadith can be in several books.'}</p>`;
  if(res.hDone && res.fail>0) hv+=`<p class="note">${ms?`${res.fail} kitab tidak dapat dimuatkan (tiada internet).`:`${res.fail} kitab could not be loaded (no internet).`}</p>`;
  /* Not in this app's books (or only partly): check it outside (Azli, 17 Oct 2026). The text is copied first, because
     Semak Hadis has no search link: paste it in their search box. */
  if(res.hDone && !res.short){ const t=encodeURIComponent((ckSt.text||'').slice(0,300));
    hv+=`<div class="ck-out"><div class="label" style="margin-top:10px">${ms?'Semak di luar aplikasi':'Check outside the app'}</div>
     <p class="note" style="margin-top:0">${ms?'Teks anda disalin dahulu; untuk Semak Hadis, tampal di kotak cariannya.':'Your text is copied first; for Semak Hadis, paste it in its search box.'}</p>
     <div class="row2" style="gap:8px;flex-wrap:wrap"><a class="pill" data-ckx href="https://semakhadis.com/" target="_blank" rel="noopener">Semak Hadis ›</a><a class="pill" data-ckx href="https://dorar.net/hadith/search?q=${t}" target="_blank" rel="noopener">Dorar.net ›</a><a class="pill" data-ckx href="https://sunnah.com/search?q=${t}" target="_blank" rel="noopener">Sunnah.com ›</a></div>
     <p class="note" style="font-size:12px">${ms?'Semak Hadis (Bahasa Melayu): semakhadis.com. Dorar.net: ensiklopedia hadis ad-Durar as-Saniyyah dengan penilaian ulama. Sunnah.com: kitab-kitab hadis dalam bahasa Inggeris.':'Semak Hadis (Malay): semakhadis.com. Dorar.net: the hadith encyclopedia of ad-Durar as-Saniyyah, with scholars\' gradings. Sunnah.com: the hadith books in English.'}</p></div>`; }
  const show=ktShow();
  hBox.innerHTML=`<div class="label">${ms?'Hadis':'Hadith'}</div>${hv}`+res.h.map((r,i)=>{ const k=(ktBooks||[]).find(x=>x.id===r.k); if(!k) return '';
    const sc=r.sc, how=res.isAr?(ms?`${ckPct(Math.max(sc.qc,sc.hc))} sama (Arab)`:`${ckPct(Math.max(sc.qc,sc.hc))} the same (Arabic)`):(ms?`${ckPct(Math.max(sc.qc,sc.hc))} perkataan sama (${sc.L==='id'?'Indonesia':'Inggeris'})`:`${ckPct(Math.max(sc.qc,sc.hc))} of words the same (${sc.L==='id'?'Indonesian':'English'})`);
    const whole=sc.qc>=0.8, part=`<div class="ck-v ${whole?'ck-ok':'ck-mid'}" style="font-size:13.5px;padding:5px 10px">${whole?(ms?'Teks itu ada dalam hadis ini':'The text is in this hadith'):(ms?'Hanya sebahagian teks itu sepadan dengan hadis ini':'Only part of the text matches this hadith')}</div>`;
    return `<div data-ck="${i}" class="ck-hd">${part}${ktCard(k,r.h,show,`<div class="row2" style="gap:6px;margin:0 0 6px"><button class="pill" data-open="${i}">${esc(KT_SHORT[k.id]||k.en)} ${r.h[0]} ›</button><small class="note" style="margin:0">${how}</small></div>`,r.sn,null)}</div>`; }).join('');
  hBox.onclick=e=>{ if(e.target.closest('[data-ckx]')){ putClipboard(ckSt.text||''); goingAway(); return; } const o=e.target.closest('[data-open]'); const w=e.target.closest('[data-ck]'); if(!w) return; const r=res.h[+w.dataset.ck]; if(!r) return;
    if(o){ ktOpenHadith(r.k,r.h[0],r.sn).then(()=>navRetSet('panel',()=>checkPanel(),ms?'Semakan':'Check')); return; }
    const k=ktBooks.find(x=>x.id===r.k); ktCardClick(e,k,n=>n===r.h[0]?{h:r.h,sn:r.sn}:null,()=>{ w.outerHTML=`<div data-ck="${w.dataset.ck}" class="ck-hd">${ktCard(k,r.h,ktShow(),'',r.sn,null)}</div>`; }); };
  msg.textContent= res.hDone ? '' : '';
  if(!restored) document.getElementById('chk')?.scrollTo?.({top:0}); }

/* ============================ MASJID & MUSOLLAH (Azli, 15 Oct 2026) ============================
   Mosques: MUIS's mosque directory (names, addresses, phone), located by postal code with OneMap (Singapore Land Authority).
   Musollah / surau: OpenStreetMap and Wikipedia have very few, so most will be the ones you add yourself ("My places").
   Kept in this app's GitHub repository (mosque/places.json) and saved on the phone after first use. */
let mqD=null, mqF=store.get('mqF','all'), mqQ='';
const mqMine=()=>store.get('myPlaces',[]);
function mqDist(a,b){ const R=6371, r=x=>x*Math.PI/180, dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const mqKm=d=>d<1?Math.round(d*1000/10)*10+' m':d.toFixed(d<10?1:0)+' km';
function mqDir(p){ return p.lat!=null ? `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.n+' '+(p.a||'')+' Singapore')}`; }
async function mqPanel(){ const ms=sL()==='ms';
  const b=openPanel('mq', ms?'Masjid & musolla':'Masjid & musollah', `<div class="mq-top">
     <div class="row2" style="gap:8px"><input class="field" id="mqQ" placeholder="${ms?'Cari nama, jalan atau poskod':'Search name, street or postal code'}" autocomplete="off" enterkeyhint="search" style="flex:1" value="${esc(mqQ)}">
      <button class="pill" id="mqLoc" aria-label="${ms?'Lokasi saya':'My location'}" style="height:44px">${ic('pin')}</button></div>
     ${segHtml('mqF',[['all',ms?'Semua':'All'],['m','Masjid'],['s',ms?'Musolla':'Musollah'],['me',ms?'Tempat saya':'My places']],mqF)}</div>
   <p class="note" id="mqInfo"></p><ul class="list mq-l" id="mqL"></ul>
   <div class="row2" style="margin-top:12px"><button class="pill primary" id="mqAdd" style="flex:1;justify-content:center">${ic('plus')}${ms?'Tambah tempat':'Add a place'}</button></div>
   <p class="note" style="font-size:12px;margin-top:14px">${ms?
    'Senarai masjid: Direktori Masjid MUIS (dikemas kini 21 September 2026); lokasi dari poskod melalui OneMap (SLA). Musolla: OpenStreetMap (© penyumbang OpenStreetMap, ODbL) dan Wikipedia; sangat sedikit, jadi tambah sendiri yang anda tahu. Waktu buka, kemudahan dan ruang wanita tidak disenaraikan: semak di tempat itu.'
    :'Mosque list: MUIS Mosque Directory (updated 21 September 2026); locations from the postal code via OneMap (SLA). Musollah: OpenStreetMap (© OpenStreetMap contributors, ODbL) and Wikipedia; there are very few, so add the ones you know. Opening hours, facilities and women\'s areas are not listed: check at the place.'}</p>`);
  const pnl=document.getElementById('mq'); { const top=pnl.querySelector('.panel-top'), head=document.createElement('div'); head.className='kt-head'; top.before(head); head.append(top,pnl.querySelector('.mq-top')); }
  const draw=()=>mqDraw(); window.mqRedraw=draw;
  pnl.querySelector('#mqQ').oninput=e=>{ mqQ=e.target.value; draw(); };
  pnl.querySelector('#mqF').onclick=e=>{ const x=e.target.closest('button'); if(!x) return; mqF=x.dataset.v; store.set('mqF',mqF); pnl.querySelectorAll('#mqF button').forEach(y=>y.setAttribute('aria-pressed',y===x)); draw(); };
  pnl.querySelector('#mqLoc').onclick=()=>{ window.__mqWantLoc=true; prLocate(); };
  b.querySelector('#mqAdd').onclick=()=>mqEdit(null);
  b.querySelector('#mqL').onclick=e=>{ const ed=e.target.closest('[data-ed]'); if(ed){ mqEdit(ed.dataset.ed); return; } };
  if(!mqD){ b.querySelector('#mqInfo').textContent=ms?'Memuatkan…':'Loading…'; try{ mqD=await ktGet('../mosque/places.json'); }catch(e){ mqD={p:[]}; b.querySelector('#mqInfo').textContent=ms?'Senarai masjid perlukan internet kali pertama. Tempat anda sendiri tetap ada.':'The mosque list needs the internet the first time. Your own places are still here.'; } }
  draw(); }
window.mqOnLoc=g=>{ if(window.__mqWantLoc){ window.__mqWantLoc=false; if(window.__mqLocFor){ const f=window.__mqLocFor; window.__mqLocFor=null; f(g); return; } } if(document.getElementById('mq')?.hidden===false) mqDraw(); };
function mqDraw(){ const ms=sL()==='ms', list=document.getElementById('mqL'), info=document.getElementById('mqInfo'); if(!list) return;
  const me=store.get('prGps',null), here=me&&me.lat!=null?me:null;
  let ps=[...mqMine().map(p=>Object.assign({mine:true},p)), ...((mqD&&mqD.p)||[])];
  if(mqF==='m') ps=ps.filter(p=>p.t==='m'); else if(mqF==='s') ps=ps.filter(p=>p.t==='s'); else if(mqF==='me') ps=ps.filter(p=>p.mine);
  const q=fold(mqQ.trim()); if(q) ps=ps.filter(p=>fold(`${p.n} ${p.a||''} ${p.pc||''} ${p.note||''}`).includes(q));
  ps.forEach(p=>{ p._d = here && p.lat!=null ? mqDist(here,p) : null; });
  ps.sort((x,y)=> (x._d==null)-(y._d==null) || (x._d??0)-(y._d??0) || x.n.localeCompare(y.n));
  info.textContent = here ? (ms?'Paling dekat dahulu, dari lokasi terakhir anda. Ketik 📍 untuk kemas kini.':'Nearest first, from your last location. Tap 📍 to update it.') : (ms?'Ketik 📍 untuk susun ikut jarak dari anda.':'Tap 📍 to sort by distance from you.');
  if(!ps.length){ list.innerHTML=`<li><p class="empty">${mqF==='me'?(ms?'Belum ada tempat anda. Ketik "Tambah tempat".':'No places of your own yet. Tap "Add a place".'):(ms?'Tiada yang sepadan.':'Nothing matches.')}</p></li>`; return; }
  list.innerHTML=ps.slice(0,150).map(p=>{ const typ=p.t==='m'?'Masjid':(ms?'Musolla':'Musollah');
    const src=p.mine?(ms?'Tempat saya':'My place'):p.src==='muis'?'MUIS':p.src==='osm'?'OpenStreetMap':p.src==='wiki'?'Wikipedia':'';
    return `<li class="mq-i"><div class="mq-t"><b>${esc(p.n)}</b><small>${esc(typ)}${p._d!=null?' · '+mqKm(p._d):''} · ${esc(src)}</small>${p.a?`<small>${esc(p.a)}</small>`:''}${p.note?`<small>${esc(ms&&!p.mine?p.note.replace('Not administered by MUIS','Bukan di bawah pentadbiran MUIS').replace('(Johor government)','(kerajaan Johor)').replace('On Pulau Bukom, an industrial island with restricted access','Di Pulau Bukom, pulau perindustrian dengan akses terhad'):p.note)}</small>`:''}</div>
      <div class="mq-b"><a class="pill" href="${mqDir(p)}" target="_blank" rel="noopener">${ic('route')}${ms?'Arah':'Directions'}</a>${p.tel?`<a class="pill" href="tel:${esc(p.tel)}">${ms?'Telefon':'Call'}</a>`:''}${p.mine?`<button class="pill" data-ed="${esc(p.id)}">${ic('edit')}${ms?'Ubah':'Edit'}</button>`:''}</div></li>`; }).join('')
   +(ps.length>150?`<li><p class="note">${ms?'150 pertama ditunjukkan; taip untuk cari.':'First 150 shown; type to search.'}</p></li>`:''); }
function mqEdit(id){ const ms=sL()==='ms', all=mqMine(), p=id?all.find(x=>x.id===id):null; const cur={t:p?.t||'s',lat:p?.lat??null,lng:p?.lng??null};
  openSheet(p?(ms?'Ubah tempat':'Edit place'):(ms?'Tambah tempat':'Add a place'), `
   <div class="label" style="margin-top:0">${ms?'Nama':'Name'}</div><input class="field" id="mqN" style="width:100%" value="${esc(p?.n||'')}" placeholder="${ms?'cth. Musolla Tingkat 3, Northpoint':'e.g. Musollah Level 3, Northpoint'}">
   <div class="label">${ms?'Jenis':'Type'}</div>${segHtml('mqT',[['m','Masjid'],['s',ms?'Musolla / surau':'Musollah / surau']],cur.t)}
   <div class="label">${ms?'Alamat':'Address'}</div><input class="field" id="mqA" style="width:100%" value="${esc(p?.a||'')}">
   <div class="label">${ms?'Catatan (tingkat, ruang wanita, tempat wuduk…)':'Notes (level, women\'s area, wudhu…)'}</div><input class="field" id="mqNo" style="width:100%" value="${esc(p?.note||'')}">
   <div class="label">${ms?'Lokasi':'Location'}</div>
   <div class="row2" style="gap:8px"><button class="pill" id="mqHere">${ic('pin')}${ms?'Lokasi saya sekarang':'My location now'}</button><span class="note" id="mqLL" style="margin:0">${cur.lat!=null?cur.lat.toFixed(5)+', '+cur.lng.toFixed(5):''}</span></div>
   <input class="field" id="mqLink" style="width:100%;margin-top:8px" placeholder="${ms?'atau tampal pautan Google Maps / koordinat':'or paste a Google Maps link / coordinates'}">
   <div class="row2" style="gap:8px;margin-top:14px">${p?`<button class="pill" id="mqDel" style="color:var(--bad)">${ic('trash')}${ms?'Padam':'Delete'}</button>`:''}<span style="flex:1"></span><button class="pill primary" id="mqOk">${ms?'Simpan':'Save'}</button></div>`);
  const $=s=>sheetB.querySelector(s), showLL=()=>{ $('#mqLL').textContent=cur.lat!=null?cur.lat.toFixed(5)+', '+cur.lng.toFixed(5):''; };
  $('#mqT').onclick=e=>{ const x=e.target.closest('button'); if(!x) return; cur.t=x.dataset.v; sheetB.querySelectorAll('#mqT button').forEach(y=>y.setAttribute('aria-pressed',y===x)); };
  $('#mqHere').onclick=()=>{ window.__mqWantLoc=true; window.__mqLocFor=g=>{ cur.lat=g.lat; cur.lng=g.lng; if($('#mqLL')) showLL(); }; prLocate(); };
  $('#mqLink').oninput=e=>{ const v=e.target.value; const m=/@(-?\d+\.\d+),(-?\d+\.\d+)/.exec(v)||/[?&](?:q|query|destination|ll)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/.exec(v)||/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/.exec(v);
    if(m){ cur.lat=+m[1]; cur.lng=+m[2]; showLL(); } };
  $('#mqOk').onclick=()=>{ const n=$('#mqN').value.trim(); if(!n){ toast(ms?'Tulis nama tempat.':'Write the name of the place.'); return; }
    const o={id:p?.id||'u'+Date.now(), n, t:cur.t, a:$('#mqA').value.trim(), note:$('#mqNo').value.trim(), lat:cur.lat, lng:cur.lng};

  $('#mqDel')?.addEventListener('click',()=>{ if(!confirm(ms?'Padam tempat ini?':'Delete this place?')) return; store.set('myPlaces',mqMine().filter(x=>x.id!==id)); closeSheet(); window.mqRedraw?.(); }); }

/* ============================ SIFAT SOLAT NABI (Azli, 15 Oct 2026) ============================
   The Prophet's prayer ﷺ step by step, written for this app (solat/solat2.json, built from tools/sifat_solat.py). Each step
   cites hadith in the seven books with their gradings; where scholars differ, the schools' positions and al-Albani's are
   given side by side with their evidence, without choosing between them. */
let solatD=null; const slData={};
const SOLAT_WHO_C={nawawi:'#2e7d32',arnaut:'#5b6b7a',shafii:'#2e7d32',hanafi:'#1565c0',maliki:'#8e24aa',hanbali:'#c25e00',albani:'#5b6b7a'};
/* Two books in the same layout: Sifat Solat Nabi and Solat Jumaat (Azli, 17 Oct 2026). */
const SLK={
 solat:{file:'../solat/solat2.json',pid:'solat',pidE:'solatE',last:'solatLast',bm:'solatBm',titles:'solatTitles',np:'p',pre:'sl',
  title:ms=>ms?'Sifat Solat Nabi ﷺ':'The Prophet\'s Prayer ﷺ', copy:'Sifat Solat Nabi ﷺ',
  intro:ms=>ms?'Langkah demi langkah dengan hadisnya dan darjatnya. Di mana ulama berbeza, pendapat empat mazhab (Syafi\'i, Hanafi, Maliki, Hanbali) diletakkan bersebelahan dengan dalil masing-masing, tanpa memilih antara mereka; pandangan ulama lain (Imam al-Nawawi, al-Albani, Ibn Baz, Ibn \'Uthaimin, Syu\'aib al-Arna\'ut dan lain-lain) dalam kotak berasingan yang boleh dibuka, setiap satu dengan rujukannya. Untuk amalan, ikut guru anda.':'Step by step, with the hadith and their gradings. Where scholars differ, the four schools (Shafi\'i, Hanafi, Maliki, Hanbali) are set side by side with their evidence, without choosing between them; other scholars\' views (Imam al-Nawawi, al-Albani, Ibn Baz, Ibn \'Uthaymin, Shu\'ayb al-Arna\'ut and others) are in a separate box you can open, each with its reference. For practice, follow your teacher.',
  foot:ms=>ms?'Sumber pendapat mazhab: al-Nawawi, al-Majmu\' dan Minhaj at-Talibin; Ibn Qudamah, al-Mughni; Ibn Rushd, Bidayat al-Mujtahid. Ulama lain: hanya pendapat yang ada rujukannya (kitab, jilid/halaman, dan pautan ke laman fatwa beliau, ad-Durar as-Saniyyah atau IslamQA) dimasukkan. Ditulis untuk aplikasi ini; semak dengan guru anda.':'Sources for the schools\' positions: al-Nawawi, al-Majmu\' and Minhaj at-Talibin; Ibn Qudamah, al-Mughni; Ibn Rushd, Bidayat al-Mujtahid. Other scholars: only views with a reference are included (book, volume/page, and a link to the scholar\'s fatwa site, Dorar.net or IslamQA). Written for this app; check with your teacher.'},
 jumuah:{file:'../solat/jumuah.json',pid:'jumuah',pidE:'jumuahE',last:'jumLast',bm:'jumBm',titles:'jumTitles',np:'j',pre:'jm',
  title:ms=>ms?'Solat Jumaat':'Friday Prayer (Jumu\'ah)', copy:'Solat Jumaat',
  intro:ms=>ms?'Sunnah Nabi ﷺ pada hari Jumaat, dari persiapan sebelum khutbah hingga selepas solat, dengan hadisnya dan darjatnya. Di mana ulama berbeza (solat sunat qabliyah, rukun khutbah), pendapat empat mazhab diletakkan bersebelahan dengan rujukannya, dan pandangan ulama lain dalam kotak berasingan. Untuk amalan, ikut guru anda.':'The sunnah of the Prophet ﷺ on Friday, from preparing before the khutbah to after the prayer, with the hadith and their gradings. Where scholars differ (a qabliyyah sunnah, the pillars of the khutbah), the four schools are set side by side with their references, and other scholars\' views are in a separate box. For practice, follow your teacher.',
  foot:ms=>ms?'Pendapat mazhab dan ulama: hanya yang ada rujukannya (kitab, jilid/halaman, dan pautan) dimasukkan. Ditulis untuk aplikasi ini; semak dengan guru anda.':'Schools\' and scholars\' views: only those with a reference (book, volume/page, and a link) are included. Written for this app; check with your teacher.'}};
async function solatLoad(kind='solat'){ if(slData[kind]) return slData[kind]; const D=await ktGet(SLK[kind].file); slData[kind]=D; if(kind==='solat') solatD=D; return D; }
async function solatPanel(kind='solat'){ const ms=sL()==='ms', K=SLK[kind];
  const b=openPanel(K.pid, K.title(ms), `<p class="note">${ms?'Memuatkan…':'Loading…'}</p>`);
  let D; try{ D=await solatLoad(kind); }catch(e){ b.innerHTML=`<p class="note">${ms?'Perlu internet kali pertama.':'This needs the internet the first time.'}</p>`; return; }
  b.innerHTML=`<p class="note" style="margin-top:0">${K.intro(ms)}</p>
   ${kind==='jumuah'?`<div id="jmKh"></div>`:''}
   <div class="sl-top"></div>
   <ol class="sl-list">${D.steps.map((e,i)=>`<li><button class="sr-row" data-st="${e.id}"><b>${i+1}. ${esc(sT(e.t))}</b>${(e.d||[]).length?`<span class="sl-diff">${ms?'ada perbezaan':'scholars differ'}</span>`:''}</button></li>`).join('')}</ol>
   <p class="note" style="font-size:12px">${K.foot(ms)}</p>`;
  { const t={}; D.steps.forEach(e=>t[e.id]=e.t); store.set(K.titles,t); }
  const drawTop=()=>{ const last=store.get(K.last,null), le=last&&D.steps.find(x=>x.id===last), bm=store.get(K.bm,{});
    const bms=Object.entries(bm).map(([id,v])=>{ const e=D.steps.find(x=>x.id===id); return e&&{key:id,c:v.c,t:v.t,label:`${D.steps.indexOf(e)+1}. ${sT(e.t)}`,note:!!noteGet(K.np+':'+id)}; }).filter(Boolean).sort((x,y)=>y.t-x.t);
    b.querySelector('.sl-top').innerHTML=`${le?`<button class="tile wide sr-cont" data-st="${le.id}"><span style="flex:1"><small>${ms?'Sambung membaca':'Continue reading'}</small><br><b>${esc(sT(le.t))}</b></span>›</button>`:''}${bmTopHtml(K.pre,bms,ms)}`; };
  drawTop(); document.getElementById(K.pid).__redraw=drawTop;
  if(kind==='jumuah') khutbahBox(b.querySelector('#jmKh'),ms);
  b.onclick=e=>{ if(bmTopClick(e,drawTop,k=>solatStep(k,kind))) return; const x=e.target.closest('[data-st]'); if(x) solatStep(x.dataset.st,kind); }; }
function solatCopy(e,i,kind='solat'){ const ms=sL()==='ms', K=SLK[kind], D=slData[kind], L=[`${i+1}. ${sT(e.t)}`,'',sT(e.s)];
  if((e.h||[]).length){ L.push('', ms?'Hadis:':'Hadith:'); e.h.forEach(([bk,n,sn,nt])=>L.push(`• ${KT_SHORT[bk]||bk} ${n}${nt?': '+sT(nt):''}`)); }
  (e.d||[]).forEach(x=>{ L.push('', sT(x.topic)); x.p.forEach(p=>L.push(`• ${sT(D.who[p.w]||{en:p.w,ms:p.w})}: ${ms?(p.ms||p.en):p.en}${p.ref?' ['+p.ref+']':''}`)); if(x.note) L.push(sT(x.note)); });
  const nt=noteGet(K.np+':'+e.id); if(nt) L.push('', (ms?'Nota saya: ':'My note: ')+nt.t);
  L.push('', '— My Personal Quran · '+K.copy); putClipboard(L.join('\n')).then(ok=>toast(ok?(ms?'Disalin':'Copied'):(ms?'Tidak dapat menyalin':'Could not copy'))); }
function solatOpen(id,kind='solat'){ const K=SLK[kind]; document.querySelectorAll('.panel').forEach(p=>{ if(p.id!==K.pid) p.hidden=true; }); if(document.getElementById(K.pid)?.hidden!==false) solatPanel(kind); solatStep(id,kind); }
async function solatStep(id,kind='solat'){ const K=SLK[kind]; const D=await solatLoad(kind); const i=D.steps.findIndex(e=>e.id===id), e=D.steps[i]; if(!e) return; const ms=sL()==='ms';
  store.set(K.last,id); const prev=D.steps[i-1], next=D.steps[i+1];
  const COM=new Set(D.com||['albani']);
  let k=0; const gr=[]; const hl=hs=>hs.map(([bk,n,sn,nt])=>{ gr.push([bk,n,sn]); return `<button class="sr-link" data-h="${bk}:${n}:${sn}"><b>${esc(KT_SHORT[bk]||bk)} ${n}</b><span class="sr-gr" data-g="${k++}"></span>${nt?`<small>${esc(sT(nt))}</small>`:''}</button>`; }).join('');
  const hh=hl(e.h||[]);
  const dd=(e.d||[]).map(x=>`<div class="sl-d"><div class="sl-dt">${esc(sT(x.topic))}</div>
     ${x.p.filter(p=>!COM.has(p.w)).map(p=>`<div class="sl-p" style="--c:${SOLAT_WHO_C[p.w]||'#777'}"><b>${esc(sT(D.who[p.w]||{en:p.w,ms:p.w}))}${grWaf(p.w)}</b><span>${esc(ms?(p.ms||p.en):p.en)}</span>${p.ref?`<small class="sl-ref">${ms?'Rujukan':'Reference'}: ${esc(p.ref)}${p.src?` · <a class="sl-src" href="${esc(p.src)}" target="_blank" rel="noopener">${ms?'Buka sumber':'Open source'} ›</a>`:''}</small>`:''}</div>`).join('')}
     ${(()=>{ const c=x.p.filter(p=>COM.has(p.w)); if(!c.length) return ''; const names=c.map(p=>sT(D.who[p.w]||{en:p.w,ms:p.w})).join(', ');
       return `<details class="sl-com"><summary>${ms?'Pandangan ulama lain':'Other scholars\' views'} <small>(${esc(names)})</small></summary>${c.map(p=>`<p class="sl-cp"><b>* ${esc(sT(D.who[p.w]||{en:p.w,ms:p.w}))}${ULAMA_D[p.w]?` <i class="wf">(${esc(wafTxt(p.w))})</i>`:''}:</b> ${esc(ms?(p.ms||p.en):p.en)}${p.ref?`<br><small class="sl-ref">${ms?'Rujukan':'Reference'}: ${esc(p.ref)}</small>`:''}${p.src?`<br><a class="sl-src" href="${esc(p.src)}" target="_blank" rel="noopener">${ms?'Buka sumber':'Open source'} ›</a>`:''}</p>`).join('')}</details>`; })()}
     ${(x.h||[]).length?`<div class="label" style="margin-top:8px">${ms?'Dalil yang dibincangkan':'Evidence discussed'}</div><div class="sr-links">${hl(x.h)}</div>`:''}
     ${x.note?`<p class="note" style="margin:8px 0 0">${esc(sT(x.note))}${x.src?`<br><a class="sl-src" href="${esc(x.src)}" target="_blank" rel="noopener">${ms?'Buka sumber':'Open source'} ›</a>`:''}</p>`:''}</div>`).join('');
  const bmc=(store.get(K.bm,{})[id]||{}).c, snt=noteGet(K.np+':'+id);
  const b=openPanel(K.pidE, `${i+1}. ${sT(e.t)}`, `<div class="sr-acts"><button class="pill" id="slBm" aria-pressed="${!!bmc}">${ic('bmk')}${bmc?(ms?'Ditanda':'Bookmarked'):(ms?'Penanda':'Bookmark')}</button><button class="pill${snt?' on':''}" id="slNote">${ic('note')}${snt?(ms?'Sunting nota':'Edit note'):(ms?'Nota':'Note')}</button><button class="pill" id="slCopy">${ic('copy')}${ms?'Salin':'Copy'}</button></div>
    <p class="sr-sum">${esc(sT(e.s))}</p>
    ${(e.src||[]).length?`<p class="note" style="margin:-4px 0 10px">${e.src.map(([l,u])=>`<small class="sl-ref">${esc(l)}</small> <a class="sl-src" href="${esc(u)}" target="_blank" rel="noopener">${ms?'Buka sumber':'Open source'} ›</a>`).join('<br>')}</p>`:''}
    ${snt?`<div class="kt-note" id="slNt" dir="auto">${esc(snt.t)}</div>`:''}
    ${(e.dua||[]).length?`<div class="sr-links">${e.dua.map(([cid,lb])=>`<button class="sr-link" data-dua="${cid}"><b>${ms?'Buka di Doa & zikir':'Open in Doa & zikir'} ›</b><small>${esc(sT(lb))}</small></button>`).join('')}</div>`:''}
    ${hh?`<div class="label">${ms?'Hadis':'Hadith'}</div><div class="sr-links">${hh}</div>`:''}
    ${dd?`<div class="label">${ms?'Perbezaan pendapat ulama':'Where scholars differ'}</div>${dd}`:''}
    <div class="row2" style="gap:8px;margin-top:16px">${prev?`<button class="pill" data-go="${prev.id}">‹ ${esc(sT(prev.t))}</button>`:''}<span style="flex:1"></span>${next?`<button class="pill" data-go="${next.id}">${esc(sT(next.t))} ›</button>`:''}</div>`);
  b.closest('.panel').scrollTop=0;
  const back=()=>{ solatOpen(id,kind); }, label=sT(e.t);
  b.onclick=ev=>{ const h=ev.target.closest('[data-h]'); if(h){ const [bk,n,sn]=h.dataset.h.split(':'); window.__relRet={go:back,label}; sirahBooks().then(()=>ktRelSheet(bk,+n,null,null,null,+sn)); return; }
    const go=ev.target.closest('[data-go]'); if(go){ solatStep(go.dataset.go,kind); return; }
    const du=ev.target.closest('[data-dua]'); if(du){ duaOpen(+du.dataset.dua); return; }
    const re=()=>{ const pn=b.closest('.panel'), y=pn.scrollTop; solatStep(id,kind).then(()=>{ b.closest('.panel').scrollTop=y; }); };
    if(ev.target.closest('#slBm')){ bmColSheet((ms?'Penanda · ':'Bookmark · ')+sT(e.t), bmc, c=>{ const m=store.get(K.bm,{}); if(c) m[id]={c,t:Date.now()}; else delete m[id]; store.set(K.bm,m); toast(c?(ms?'Ditanda':'Bookmarked'):(ms?'Penanda dibuang':'Bookmark removed')); re(); }); return; }
    if(ev.target.closest('#slNote,#slNt')){ noteSheet(K.np+':'+id,null,re); return; }
    if(ev.target.closest('#slCopy')){ solatCopy(e,i,kind); return; } };
  await sirahBooks();
  gr.forEach(async([bk,n,sn],j)=>{ try{ const jj=await ktGet(`${bk}/${sn}.json`); const hd=jj.h.find(x=>x[0]===n); const el=b.querySelector(`.sr-gr[data-g="${j}"]`); if(!el||!hd) return;
    const g=hd[5]||[]; el.innerHTML=g.length?g.map(([w,v])=>`<span class="kt-g ${ktGradeCls(v)}"><small>${esc(KT_GR[w]||w)}${grWaf(w)}</small> <b${w==='tir'?' dir="rtl" lang="ar" style="font-family:var(--ar);font-weight:400"':''}>${esc(w==='tir'?v:ktGradeTxt(v))}</b></span>`).join(''):(bk==='bukhari'||bk==='muslim')?`<span class="kt-g g-s"><b>Sahih</b></span>`:''; }catch(_){} }); }
/* MUIS's Friday khutbah (Azli, 17 Oct 2026): the latest one, found each Thursday evening and Friday morning by a GitHub
   workflow from MUIS's khutbah page (khutbah/latest.json), with a link to all their khutbah. */
async function khutbahBox(box,ms){ if(!box) return; const all='https://www.muis.gov.sg/resources/khutbah-and-religious-advice/khutbah/';
  const base=`<div class="label">${ms?'Khutbah Jumaat MUIS':'MUIS Friday khutbah'}</div>`;
  box.innerHTML=base+`<a class="tile wide sr-cont" href="${all}" target="_blank" rel="noopener"><span style="flex:1"><small>muis.gov.sg</small><br><b>${ms?'Semua khutbah MUIS':'All MUIS khutbahs'}</b></span>›</a>`;
  let j=null; try{ j=await ktGet('../khutbah/latest.json'); }catch(e){} if(!j||!(j.items||[]).length) return;
  const want=ms?'ms':'en', its=j.items.filter(x=>!x.lang||x.lang===want), other=j.items.find(x=>x.lang===(ms?'en':'ms')&&x.date===(its[0]||{}).date);
  box.innerHTML=base+[its[0],other,its[1]].filter(Boolean).map(x=>`<a class="tile wide sr-cont" href="${esc(x.url)}" target="_blank" rel="noopener"><span style="flex:1"><small>${esc(x.date||'')}</small><br><b>${esc(x.title)}</b></span>›</a>${x.pdf?`<a class="sl-src" style="margin:0 0 8px 14px;display:inline-block" href="${esc(x.pdf)}" target="_blank" rel="noopener">PDF ›</a>`:''}`).join('')+`<a class="sl-src" style="margin:2px 0 10px 4px;display:inline-block" href="${all}" target="_blank" rel="noopener">${ms?'Semua khutbah MUIS':'All MUIS khutbahs'} ›</a>`; }
/* ---- Back to where you came from (Azli, 15 Oct 2026) ----
   Opening an ayah or a hadith from the Sirah leaves it; the phone's back button (or the "Back to" button) returns to the
   same event instead of going to Home. */
let navRet=null;
function navRetSet(kind,go,label){ navRet={kind,go,label,pid:kind==='panel'?topPanel()?.id:null}; navRetChip(); }
function navRetClear(){ navRet=null; navRetChip(); }
function navRetChip(){ let c=document.getElementById('navRet'); if(!navRet||navRet.kind!=='reader'){ if(c) c.remove(); return; }
  if(!c){ c=document.createElement('button'); c.id='navRet'; c.className='navret'; document.body.appendChild(c); c.onclick=()=>navRetGo(); }
  c.textContent='‹ '+(sL()==='ms'?'Kembali: ':'Back: ')+navRet.label; }
function navRetGo(){ const r=navRet; if(!r) return false; navRetClear();
  if(r.kind==='panel') document.querySelectorAll('.panel').forEach(p=>{ if(/^kt/.test(p.id)) p.hidden=true; });
  r.go(); return true; }
/* ---- Look up a word: long-press (select) a word in the Sirah, Hadith or Doa pages ---- */
let lkBtn=null;
document.addEventListener('selectionchange',()=>{ const sel=document.getSelection(), t=(sel&&String(sel)).trim();
  const inside=t && sel.anchorNode && sel.anchorNode.parentElement?.closest('.panel,.sheet') && !sel.anchorNode.parentElement.closest('input,textarea');
  if(!inside || t.length>40 || t.split(/\s+/).length>3){ if(lkBtn){ lkBtn.remove(); lkBtn=null; } return; }
  if(!lkBtn){ lkBtn=document.createElement('button'); lkBtn.className='lookup'; document.body.appendChild(lkBtn);
    lkBtn.addEventListener('pointerdown',ev=>ev.preventDefault()); lkBtn.onclick=()=>{ const w=lkBtn.dataset.w; lkBtn.remove(); lkBtn=null; lookupSheet(w); }; }
  lkBtn.dataset.w=t; lkBtn.textContent=(sL()==='ms'?'Cari makna: ':'Meaning: ')+(t.length>18?t.slice(0,18)+'…':t); });
function lookupSheet(w){ return window.__meaning(w); }

/* Tap once on a page to hide or show its fixed top part (Doa & zikir, Hadith, Sirah: Azli, 15 Oct 2026). Taps on buttons,
   links, fields and while selecting text do not count. */
document.addEventListener('click',e=>{ const pnl=e.target.closest('.panel'); if(!pnl||pnl.hidden) return; const head=pnl.querySelector('.kt-head'); if(!head) return;
  if(e.target.closest('button,a,input,select,textarea,summary,label,details>summary,.kt-head,[data-q],[data-h],[data-e],[data-c],[role=button]')) return;
  if(String(document.getSelection()||'').trim()) return;
  pnl.classList.toggle('hd-hide'); });
/* ============================ WIRING ============================ */
document.getElementById('btnNav').onclick=navSheet;
document.getElementById('btnHome').onclick=()=>{ closeSheet(); showHome(); };
document.getElementById('where').onclick=()=>{ if(!hz) navSheet(); };
document.getElementById('btnSearch').onclick=searchSheet;
document.getElementById('btnBm').onclick=()=>bmSheet(null);
function syncBlkBtn(){ document.getElementById('btnBlk').setAttribute('aria-pressed', st.blocks!=='off'); }
document.getElementById('btnBlk').onclick=()=>blocksSheet(st.sel);
document.getElementById('btnSet').onclick=setSheet;
document.getElementById('btnTr').onclick=()=>{ st.tr=!st.tr; renderReader(); };
document.getElementById('btnHz').onclick=hzSheet;
document.getElementById('btnPlay').onclick=()=>playSheet(st.sel??null);
document.getElementById('next').onclick=()=>turnPage(1);
document.getElementById('prev').onclick=()=>turnPage(-1);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyLook);

window.__back=()=>{ if(sheet.classList.contains('open')){ closeSheet(); return true; }
  if(tq){ tqClose(); return true; } if(navRet&&navRet.kind==='panel'&&topPanel()?.id===navRet.pid) return navRetGo(); { const p=topPanel(); if(p){ closePanel(p.id); return true; } }
  { const c=document.getElementById('cover'); if(c && !c.hidden) return false; } if(document.body.classList.contains('immersive')){ setImmersive(false); return true; } if(hz){ if(rec) stopListen(false); hz=null; renderReader(); return true; }
  if(navRet&&navRet.kind==='reader'&&!topPanel()) return navRetGo();
  { const h=document.getElementById('home'); if(!h || h.hidden){ showHome(); return true; } } return false; };
/* The app goes to the background: close the book, so it opens with the cover next time. Not when the app itself sent the
   person to another screen a moment ago (a file picker, a permission or settings page). */
window.__away=0; const goingAway=()=>{ window.__away=Date.now(); };
/* Not every trip out of the app is leaving it (Azli, 17 Oct 2026): a long-press meaning in Google Translate, a source link,
   a share. So the cover comes back only after 3 minutes away, checked when the app returns. */
window.__pausedAt=0;
function coverOnLeave(){ window.__pausedAt=Date.now(); }
function coverOnReturn(){ const t=window.__pausedAt; window.__pausedAt=0; if(!t) return;
  if(store.get('cover',true) && !hz && !tq && Date.now()-t>180000 && t-window.__away>5000){ const c=document.getElementById('cover'); if(!c||c.hidden||c.classList.contains('open')) showCover(); } }
window.__pause=()=>{ try{ npFlush&&npFlush(); }catch(e){} if(rec) stopListen(false); coverOnLeave(); if(syncTm){ clearTimeout(syncTm); syncTm=0; syncNow(false); } };
window.__resume=()=>{ coverOnReturn(); setTimeout(()=>syncNow(false),800); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(!window.__pausedAt) window.__pausedAt=Date.now(); } else coverOnReturn(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden && pl){ cancelAnimationFrame(plFadeRaf); plEls.forEach(a=>{ try{ a.volume=1; }catch(e){} }); } });
/* Prayer alerts are on by default (5 prayers): set them with Android at every start, so they never run out (the list
   covers 3 weeks) even if the Prayer times page is never opened; ask once for notification permission. */
setTimeout(()=>{ try{ if(!window.AndroidExtra?.setPrayerAlarms) return; prSchedule();
  if(prStatus().notif===false && !store.get('notifAsked',false)){ store.set('notifAsked',true); goingAway(); window.AndroidExtra.askNotifications(); } }catch(e){} }, 2500);
applyLook();
setTimeout(()=>syncNow(false),2500);   // bring what changed on the other device
if(store.get('imm',false)) setImmersive(true);
if('serviceWorker' in navigator && /github\.io$/.test(location.hostname)){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
(function boot(){ const h=(location.hash||'').slice(1); let r=null;
  if(h){ r=parseRef(h.replace('.',':')) || parseRef(h); }
  // opened from a prayer notification: straight to the prayer times, no book cover
  let fromN=''; try{ fromN=window.AndroidExtra?.takeOpen?.()||''; }catch(e){}
  if(r){ r.page? goPage(r.page) : goAyah(r.g); } else { renderReader(); applyHomeLook(); showHome(); if(fromN==='prayer') prayerPanel(); else if(ckTakeShared()){} else if(store.get('cover',true)) showCover(); } })();
window.__openFrom=w=>{ if(w!=='prayer') return; const c=document.getElementById('cover'); if(c) c.hidden=true; if(document.getElementById('home')?.hidden!==false){ applyHomeLook(); showHome(); } prayerPanel(); };
applyHomeLook();
document.addEventListener('visibilitychange',()=>{ if(document.hidden) coverOnLeave(); });
</script>
