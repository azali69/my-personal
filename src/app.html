<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
@font-face{font-family:"KFGQPC Hafs";src:url(data:font/woff2;base64,%%FONT2%%) format("woff2");font-display:block}
@font-face{font-family:"Great Vibes";src:url(data:font/woff2;base64,%%FONT4%%) format("woff2");font-display:swap}
@font-face{font-family:"QCF Surah Header";src:url(data:font/woff2;base64,%%FONT3%%) format("woff2");font-display:block}
@font-face{font-family:"KFGQPC Marks";src:url(data:font/otf;base64,%%FONT%%) format("opentype");font-display:block}
/* Layout: one calm reading column (max 46rem) between a slim top bar and a bottom dock; sheets rise from the bottom. */
:root{
  --bg:#f4efe2; --surface:#fbf8f0; --fg:#2b2a24; --muted:#6d6a5d; --line:#ddd5c1;
  --shade:#e9e0c9; --accent:#2f6a58; --accent-ink:#f6f3ea; --veil:#e2d8bf;
  --ok:#2f7a4f; --bad:#b2402f; --warn:#a8741a; --unsure:#7a7f8a;
  --ar:"KFGQPC Hafs","Amiri Quran","Scheherazade New",serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --arsize:30px;
  --bm1:#2f8a5f; --bm2:#c38a1e; --bm3:#c0514a; --bm4:#3b6fb3; --bm5:#8a57b8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1b231f; --fg:#dcdccf; --muted:#9aa294; --line:#2c3730;
  --shade:#223029; --accent:#8cc4a8; --accent-ink:#11201a; --veil:#2a3831;
  --ok:#7fc79a; --bad:#f08b78; --warn:#e3b45c; --unsure:#9aa0ab; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1b231f; --fg:#dcdccf; --muted:#9aa294; --line:#2c3730;
  --shade:#223029; --accent:#8cc4a8; --accent-ink:#11201a; --veil:#2a3831;
  --ok:#7fc79a; --bad:#f08b78; --warn:#e3b45c; --unsure:#9aa0ab; color-scheme:dark}
/* Chosen backgrounds override the system palette */
:root[data-bg="kertas"]{--bg:#f4efe2;--surface:#fbf8f0;--fg:#2b2a24;--muted:#6d6a5d;--line:#ddd5c1;--shade:#e9e0c9;--accent:#2f6a58;--accent-ink:#f6f3ea;--veil:#e2d8bf;--ok:#2f7a4f;--bad:#b2402f;--warn:#a8741a;--unsure:#7a7f8a;color-scheme:light}
:root[data-bg="daun"]{--bg:#e8efe6;--surface:#f3f7f1;--fg:#1f2a22;--muted:#5d6b60;--line:#cddbca;--shade:#d8e5d3;--accent:#2e6b4c;--accent-ink:#f1f6ef;--veil:#cfdccb;--ok:#2f7a4f;--bad:#b2402f;--warn:#a06e18;--unsure:#717a80;color-scheme:light}
:root[data-bg="kabus"]{--bg:#e7edf2;--surface:#f3f6f9;--fg:#1c2631;--muted:#5b6876;--line:#cbd7e1;--shade:#d6e1ea;--accent:#2b5e78;--accent-ink:#eef4f8;--veil:#cdd9e3;--ok:#2f7a4f;--bad:#b2402f;--warn:#9c6b16;--unsure:#717a86;color-scheme:light}
:root[data-bg="pasir"]{--bg:#f2e8df;--surface:#f9f3ee;--fg:#2e2621;--muted:#74655b;--line:#e0d0c3;--shade:#e8d9cb;--accent:#7a4e36;--accent-ink:#faf3ee;--veil:#e3d2c4;--ok:#3a7a4a;--bad:#ad3b2c;--warn:#9c6a16;--unsure:#7b7b84;color-scheme:light}
:root[data-bg="malam"]{--bg:#141a17;--surface:#1b231f;--fg:#dcdccf;--muted:#9aa294;--line:#2c3730;--shade:#223029;--accent:#8cc4a8;--accent-ink:#11201a;--veil:#2a3831;--ok:#7fc79a;--bad:#f08b78;--warn:#e3b45c;--unsure:#9aa0ab;color-scheme:dark}
:root[data-bg="lautan"]{--bg:#121822;--surface:#18202c;--fg:#d6dbe4;--muted:#939caa;--line:#283242;--shade:#1f2a39;--accent:#8db7d6;--accent-ink:#0e1620;--veil:#263244;--ok:#7fc79a;--bad:#f08b78;--warn:#e3b45c;--unsure:#9aa0ab;color-scheme:dark}

*{box-sizing:border-box}
html{height:100%} body{min-height:100%}   /* not height:100%: the sticky top bar would scroll away after one screen in the translation view (Azli, 13 Oct 2026) */
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Top bar */
.top{position:sticky;top:var(--sat);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:46rem;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px}
.where{flex:1;min-width:0;background:none;border:0;text-align:start;padding:4px 6px;border-radius:10px;display:flex;flex-direction:column}
.where b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:440px){.top-in{gap:3px;padding-inline:8px}.top .ib{width:36px}:root:not([data-dock="plain"]) .top .ib{width:34px;height:34px}}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:none;display:grid;place-items:center;color:var(--fg);flex:none}
@media (hover:hover){.ib:hover{background:var(--shade)}}
.home .ib,.panel .ib{background:transparent!important}
.ib svg{width:22px;height:22px}
#btnBlk[aria-pressed="true"]{color:var(--accent);background:var(--shade)}
@media (max-width:380px){.top-in{gap:2px}.ib{width:36px}}

/* Reader */
main{max-width:46rem;margin:0 auto;padding-inline:16px;padding-block:14px 120px}
main.fit{padding-block:8px 76px}
.pagehead{display:flex;justify-content:space-between;color:var(--accent);font-weight:600;font-size:14px;margin:4px 2px 10px;font-variant-numeric:tabular-nums}
.pagefoot{display:flex;justify-content:center;margin-top:18px}
.pageno{border:1px solid var(--line);border-radius:999px;padding:2px 14px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.mushaf{direction:rtl;text-align:right;font-family:var(--ar);font-size:var(--arsize);line-height:2.25;word-spacing:.02em}
.mushaf p{margin:0}
.ay{cursor:pointer;border-radius:4px;padding-block:.42em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ay.sh{background:var(--shade)}
.ay.sel{outline:2px solid var(--accent);outline-offset:1px}
.num{display:inline-block;font-family:"KFGQPC Marks",var(--ar);font-size:1.2em;line-height:1;color:var(--accent);margin-inline:.06em;vertical-align:-.08em;font-variant-numeric:normal}
.surah-h{direction:rtl;margin:18px 0 6px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:12px}
.surah-h .ar{font-family:var(--ar);font-size:calc(var(--arsize)*.95);line-height:1.6}
.surah-h .meta{direction:ltr;text-align:right;color:var(--muted);font-size:12.5px;line-height:1.35}
.surah-h .meta b{display:block;color:var(--fg);font-size:14px}
.basmala{direction:rtl;text-align:center;font-family:var(--ar);font-size:var(--arsize);line-height:2;margin:4px 0 6px}

/* Mushaf page: the 15 lines of the Madinah Mushaf, each line filling the width */
.mpage{direction:rtl;font-family:var(--ar);--lh:2.1em;user-select:none;-webkit-user-select:none}
.mline{display:flex;align-items:stretch;justify-content:center;height:var(--lh);white-space:nowrap;padding-inline:.12em}
.mline>span{display:flex;align-items:center;flex:none;cursor:pointer}
.mline>.sp{flex:1 1 0;min-width:.22em;max-width:1.15em;cursor:default}
.mline .sh{background:var(--shade)}
.mline .sel{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.mline .num{margin-inline:.04em;vertical-align:0;font-size:1.25em}
.spage+.spage{margin-top:18px;padding-top:10px;border-top:1px solid var(--line)}
.num.hl{position:relative}.num.hl::after{content:"📖";position:absolute;top:-.95em;inset-inline-end:-.35em;font:normal .62em/1 "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;pointer-events:none}
.gmk{display:inline-block;border-radius:50%}
.gmk.bm{background:color-mix(in srgb,var(--bmc) 30%,transparent);box-shadow:0 0 0 .05em var(--bmc)}
.num.bm{color:var(--bmc);background:color-mix(in srgb,var(--bmc) 26%,transparent);border-radius:50%;box-shadow:0 0 0 .06em var(--bmc)}
.mline.bl{align-items:center}
.mline.hd{align-items:center}
/* Ornamented surah frame: King Fahd Complex surah-header font (QUL). One glyph per surah, frame and name together. */
.shdr{flex:1;align-self:stretch;container-type:size;display:flex;align-items:center;justify-content:center;color:var(--hdr,var(--accent))}
.shdr .ow{position:relative;display:inline-block;font-size:min(30cqw,230cqh);line-height:1}
.shdr .orn{font-family:"QCF Surah Header";display:block;line-height:1.05}
.shdr .sn,.shdr small{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--ar);font-size:.13em;line-height:1;color:var(--hdr,var(--accent));white-space:nowrap}
.shdr .sn{right:14%}
.shdr small{left:14%;font-size:.1em}
.hdr-v4{--hdr:color-mix(in srgb,#1f6aa5 75%,var(--fg))}
.hdr-v4t{--hdr:color-mix(in srgb,#2e7d32 75%,var(--fg))}
.mpage.short .mline{justify-content:center}
.mpage.short .mline>.sp{flex:0 0 .32em;min-width:.32em}
.pagehead.tight{margin:0 2px 4px}
.arname{font-family:var(--ar);font-weight:400;direction:rtl;unicode-bidi:isolate}
.pagehead .arname{font-size:1.3em;line-height:1}
.where b.arname{text-align:left;font-size:18px;line-height:1.25}
.pagefoot.tight{margin-top:6px}
.mline .sh2,.sh2{background:color-mix(in srgb,var(--accent) 17%,var(--bg))}
.mline .mr,.ay.mr,.row.mr{background:color-mix(in srgb,#4a78b8 22%,var(--bg));--bsc:color-mix(in srgb,#4a78b8 80%,var(--fg))}
.mline .rk,.ay.rk,.row.rk{background:color-mix(in srgb,#c79a3a 18%,var(--bg));--bsc:color-mix(in srgb,#c79a3a 85%,var(--fg))}
.mline .sh2,.ay.sh2,.row.sh2{--bsc:color-mix(in srgb,var(--accent) 85%,var(--fg))}

body:has(.selbar) .toast{bottom:auto;top:calc(80px + var(--sat))}
.mline .pick{background:color-mix(in srgb,var(--accent) 38%,transparent)!important}
main{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.selbar.mini{left:0;right:0;bottom:auto;padding:0 8px}
.selbar.mini.at-top{top:calc(var(--sat) + 4px)}
.selbar.mini.at-bottom{top:auto;bottom:calc(var(--sab) + 4px)}
.selbar.mini .selbar-in{padding:6px 8px;border-radius:14px}
.selbar.mini .selbar-t{font-size:12px;margin:0 2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selbar.mini .selbar-b{flex-wrap:nowrap;overflow-x:auto;gap:5px}
.selbar.mini .selbar-b button{height:34px;padding:0 10px;font-size:13px;flex:none}
body.selecting .top{transform:translateY(-110%);opacity:0;pointer-events:none}
body.selecting.sel-top main.fit{padding-top:calc(var(--sat) + 76px)}
body.selecting.sel-bottom main.fit{padding-bottom:76px}
body.selecting .dock{transform:translateY(110%);opacity:0;pointer-events:none}
.selbar{position:fixed;left:0;right:0;bottom:calc(76px + var(--sab));z-index:30;display:flex;justify-content:center;pointer-events:none;padding:0 12px}
body.immersive .selbar{bottom:calc(14px + var(--sab))}
.selbar-in{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px;max-width:34rem;width:100%}
.selbar-t{font-size:13.5px;font-weight:600;margin:0 4px 8px}
.selbar-b{display:flex;flex-wrap:wrap;gap:6px}
.selbar-b button{height:38px;border-radius:999px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-weight:600;font-size:13.5px}
.selbar-b button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blist li{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:6px 0}
.blist .t{flex:1;min-width:0}
.blist .t b{display:block;font-weight:600;font-size:14px}
.blist .t small{color:var(--muted);font-size:12.5px}
.blist button{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:13px;font-weight:600}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;align-items:center}
.grid3 label{font-size:12px;color:var(--muted);grid-column:1/-1;margin-top:4px}
/* Page turn: the page itself swings on the spine; nothing is copied or left behind */
/* Page curl: the next page is drawn underneath; the current page folds back over it */
.under{position:fixed;z-index:0;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:6px 10px}
.under>*{width:100%;max-width:46rem;margin-inline:auto}
main.fit.curling{z-index:1;will-change:clip-path;background:var(--bg)}
main.curling:not(.fit){position:relative;z-index:1;background:var(--bg)}
.under.flow{display:block;padding:14px 16px 120px}
.under.flow>*{max-width:calc(46rem - 32px)}
.flap{position:fixed;z-index:2;pointer-events:none;overflow:hidden;background:var(--bg);box-shadow:0 0 18px rgba(0,0,0,.22)}
.flap>.under{position:absolute;top:0;z-index:auto}
.flap::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--fd,90deg),rgba(0,0,0,.20) 0%,rgba(0,0,0,0) 20%,rgba(255,255,255,.10) 70%,rgba(0,0,0,.12) 100%)}
.ushade{position:fixed;z-index:0;pointer-events:none;width:46px;background:linear-gradient(var(--sd,90deg),rgba(0,0,0,0),rgba(0,0,0,.20))}
@media (orientation:landscape){ .under{padding-inline:max(28px,var(--sal));justify-content:flex-start} .under>*{max-width:none} }
main.turnfx{will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden}
/* Printed (glyph) pages */
.gpage{direction:rtl;--lh:2em}
.gpage .mline>.sp{min-width:0;max-width:none}
.gpage .mline.cen{justify-content:center}
.gpage .mline.cen>.sp{flex:0 0 .12em}
.gpage .mline.bl{justify-content:center;gap:.25em}
.mline.sq{transform-origin:center}
main.turning{visibility:hidden}
.loadmsg{color:var(--muted);text-align:center;padding:40px 8px}
/* Full-screen reading: tap the page to hide or show the bars */
.top,.dock{transition:transform .22s ease,opacity .22s ease}
main.fit{padding-block:calc(var(--sat) + 6px) 10px}
body.fitmode .top{position:fixed;left:0;right:0;top:0;padding-top:var(--sat);box-shadow:0 1px 0 var(--line)}
body.fitmode.immersive .top{transform:translateY(-110%);opacity:0;pointer-events:none}
body.immersive:not(.fitmode) .top{display:none}
body.immersive .dock{transform:translateY(110%);opacity:0;pointer-events:none}

main.fit{position:fixed;left:0;right:0;top:var(--pt,var(--sat));bottom:var(--pb,var(--sab));max-width:none;margin:0;padding:6px 10px 6px;
  display:flex;flex-direction:column;justify-content:center;overflow:hidden}
main.fit>*{width:100%;max-width:46rem;margin-inline:auto}
main.fit .pagefoot.tight{margin-top:4px}
@media (orientation:landscape){ main.fit{padding-inline:max(28px,var(--sal));justify-content:flex-start;overflow-y:auto} main.fit>*{max-width:none} }
.bmrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bmc{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);background:var(--c)}
.bmc[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--fg)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.bml .x{width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:10px;flex:none}
.bml li{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.bml li>button.go{border-bottom:0}
@media (prefers-reduced-motion:reduce){.top,.dock{transition:none}}
/* Translation view */
.rows{display:flex;flex-direction:column;gap:2px}
.row{padding:12px 12px 14px;border-radius:14px;cursor:pointer}
.row.sh{background:var(--shade)}
.row .arl{direction:rtl;text-align:right;font-family:var(--ar);font-size:var(--arsize);line-height:2.1}
.row .tl{font-family:var(--read);font-size:15px;line-height:1.6;margin-top:4px;color:var(--accent);font-style:italic}
.row .tr{font-family:var(--read);font-size:16px;line-height:1.65;margin-top:6px;color:var(--fg)}
/* tablets and landscape: the translation view uses the width of the screen, translation as wide as the Arabic, both larger */
@media (min-width:900px){ main.trview{max-width:min(78rem,calc(100vw - 64px))}
  body:has(main.trview) .top-in, body:has(main.trview) .dock-in{max-width:min(78rem,calc(100vw - 64px))}
  main.trview .row .tr{font-size:clamp(16px,1.45vw,21px)} main.trview .row .tl{font-size:clamp(15px,1.3vw,19px)} main.trview .row .arl{font-size:calc(var(--arsize) * 1.12)} }
.row .ref{font-family:var(--ui);font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;margin-top:6px;display:block}
.row .fn{font-family:var(--read);font-size:13.5px;color:var(--muted);margin-top:6px;white-space:pre-line}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;padding-bottom:var(--sab);background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock-in{max-width:46rem;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px 12px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.pill svg{width:20px;height:20px}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1;justify-content:center}
.dock .ib{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:44px;width:44px}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.38);z-index:46;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:50;max-height:calc(88% - var(--kb,0px));display:flex;flex-direction:column;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);transform:translateY(105%);transition:transform .25s ease;padding-bottom:var(--sab)}
.sheet.open{transform:none;visibility:visible}
.sheet{will-change:transform;backface-visibility:hidden;contain:layout paint}
.panel::before{transform:translateZ(0)}
.sheet:not(.open){visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.sheet-in{max-width:46rem;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 16px 8px}
.sheet-h h2{flex:1;margin:0;font-size:17px;font-weight:700}
.sheet-b{overflow:auto;padding:4px 16px 20px;min-height:0;overscroll-behavior:contain}
body:has(.sheet.open){overflow:hidden}body:has(.sheet.open) .home,body:has(.sheet.open) .panel{overflow:hidden}
.home,.panel{overscroll-behavior:contain}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.field{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px}
textarea.field{height:110px;padding:10px 14px;direction:rtl;font-family:var(--ar);font-size:20px;line-height:1.8;resize:vertical}
.list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.list button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start}
.list .n{width:32px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;text-align:center;flex:none}
.list .t{flex:1;min-width:0}
.list .t b{display:block;font-weight:600}
.list .t small{color:var(--muted)}
.list .a{font-family:var(--ar);font-size:22px;direction:rtl}
.label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{height:38px;border-radius:999px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.sw{border:2px solid var(--line);border-radius:14px;padding:0;overflow:hidden;background:none;text-align:start}
.sw[aria-pressed="true"]{border-color:var(--accent)}
.sw .chip{height:44px;display:flex;align-items:center;justify-content:center;font-family:var(--ar);font-size:20px}
.sw span{display:block;padding:6px 10px;font-size:13px;font-weight:600}
.note{color:var(--muted);font-size:13.5px;line-height:1.55}
.note b{color:var(--fg)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2 > *{min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
.res{padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.res .ref{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.res .arl{direction:rtl;font-family:var(--ar);font-size:22px;line-height:1.9}
.res .tr{font-family:var(--read);font-size:14.5px;color:var(--muted)}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.actions{display:flex;flex-direction:column;gap:8px}
.actions button{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:start;padding:0 16px;font-weight:600;display:flex;align-items:center;gap:10px}
.actions svg{width:20px;height:20px;color:var(--accent)}
.src{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.src li{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg)}
.src li b{display:block;margin-bottom:2px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ok)}
.ask{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px}
.ask-in{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:18px 16px 14px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.ask-in p{margin:0;white-space:pre-wrap;line-height:1.5}
.pill.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.sheet .label{font-size:14px;font-weight:800;letter-spacing:.05em;color:var(--accent);margin:26px 0 10px;padding-bottom:5px;border-bottom:1.5px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}

/* Hafazan */
.pbar[hidden]{display:none}
@media (max-width:440px){ .dock:not(.hz) .dock-in{gap:6px;padding-inline:10px} .dock:not(.hz) .pill{padding-inline:14px} .dock:not(.hz) .pill svg{display:none} }
.pbar{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 68px);z-index:24;display:flex;justify-content:center;pointer-events:none}
.pbar-in{pointer-events:auto;display:flex;align-items:center;gap:4px;max-width:46rem;width:calc(100% - 24px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 8px 6px 14px;box-shadow:0 4px 16px rgba(0,0,0,.14)}
.pbar-t{flex:1;min-width:0;line-height:1.25}.pbar-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pbar-t small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pbar .ib.pbmain{background:var(--accent);color:var(--accent-ink);border-radius:50%}
body.immersive .pbar{bottom:calc(var(--sab) + 4px);justify-content:flex-start;padding-inline:max(10px,var(--sal))}
/* bars hidden while playing: no button over the text; the page number becomes play / pause */
body.immersive.playing.haspageno .pbar{display:none}
body.immersive.playing .pageno{color:var(--accent);border-color:var(--accent);display:inline-flex;align-items:center;gap:8px;padding:5px 16px;cursor:pointer}
body.immersive.playing .pageno::before{content:'';width:10px;height:12px;border-left:3px solid currentColor;border-right:3px solid currentColor;box-sizing:border-box}
body.immersive.playing.plpaused .pageno::before{width:0;height:0;border-right:0;border-left:10px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
body.immersive .pbar-in{width:auto;padding:2px;border-radius:50%;box-shadow:0 1px 6px rgba(0,0,0,.15);opacity:.92}
body.immersive .pbar .ib.pbmain{width:36px;height:36px}
body.immersive .pbar .ib.pbmain svg{width:18px;height:18px}
body.immersive .pbar .pbar-t,body.immersive #pbPrev,body.immersive #pbNext,body.immersive #pbStop{display:none}
.mline .playing,.ay.playing,.row.playing{background:color-mix(in srgb,var(--accent) 22%,var(--bg))!important;border-radius:4px}
.mline .said{color:var(--said)!important}
.mline .now{background:color-mix(in srgb,var(--said) 16%,transparent)!important;border-radius:4px}
:root{--said:color-mix(in srgb,#d32f2f 78%,var(--fg))}
/* Listen & repeat */
.tq{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;padding:calc(var(--sat,0px) + 8px) 16px calc(var(--sab,0px) + 24px)}
.tq-in{max-width:46rem;margin:0 auto}
.tq-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tq-top h2{flex:1;font-size:17px;margin:0}
.tq-where{color:var(--muted);font-size:13.5px}
.tq-ayah{direction:rtl;text-align:right;font-family:var(--ar);font-size:var(--arsize);line-height:2.3;margin:10px 0 4px}
.tq-ayah .o{opacity:.32}
.tq-ayah .cur{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:8px}
.tq-ayah .w{background:none}
.tq-ayah .w.c{color:var(--ok)}
.tq-tr{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 8px}
.tq-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tq-row .pill{flex:1;justify-content:center;min-width:120px}
.tq-big{width:72px;height:72px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:8px auto;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.tq-big.live{background:var(--bad);animation:tqp 1.2s ease-in-out infinite}
.tq-big svg{width:30px;height:30px}
@keyframes tqp{50%{transform:scale(1.07)}}
.tq-st{text-align:center;color:var(--muted);font-size:14px;min-height:1.4em}
.tq-heard{direction:rtl;font-family:var(--ar);font-size:18px;color:var(--muted);text-align:center;min-height:1.6em}
.wbw{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.wbw-w{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 10px;min-width:64px;color:var(--fg)}
.wbw-w .ar{font-family:var(--ar);font-size:24px;line-height:1.6}
.wbw-w small{font-size:12.5px;color:var(--muted);max-width:9em;text-align:center;line-height:1.3}
.wbw-w.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.hd-item{border-top:1px solid var(--line);padding:10px 0}
.hd-ref{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.hd-g{font-size:12px;font-weight:700;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:0 8px}
.hd-ar{font-family:var(--ar);font-size:19px;line-height:1.9;margin:6px 0}
.hd-tr{font-size:15px;line-height:1.65;margin:6px 0;white-space:pre-wrap}
.hd-bab{margin-top:14px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 7%,transparent)}
.hd-bab-ar{font-family:var(--ar);font-size:18px;line-height:1.8}
.hz-sname{font-family:var(--ar);text-align:center;color:var(--accent);font-size:calc(var(--arsize)*.9);margin:14px 0 2px}
.hz-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 12px}
/* Hafazan bottom bar: Close, Show text, Type and the microphone at the right end */
.dock.hz .dock-in{gap:6px}
.dock.hz .pill{padding-inline:12px}
.dock .mic.hz-only{width:48px;height:48px;margin-inline-start:auto;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.dock .mic.hz-only svg{width:22px;height:22px}
/* bars hidden while reciting: only the microphone stays, in the same place */
body.immersive .dock.hz{transform:none;opacity:1;pointer-events:none;background:none}
body.immersive .dock.hz .dock-in>*{visibility:hidden}
body.immersive .dock.hz #mic{visibility:visible;pointer-events:auto}
.hz-range{flex:1;min-width:0;font-weight:600}
.hz-range small{display:block;color:var(--muted);font-weight:400}
.hz-text{direction:rtl;text-align:right;font-family:var(--ar);font-size:var(--arsize);line-height:2.35}
.w{border-radius:6px;transition:color .08s,background .08s;padding-block:.1em}
.w.hid{color:transparent;background:var(--veil)}
.peek .w.hid{color:var(--muted);background:transparent;opacity:.55}
.w.c{color:var(--fg)}
.w.e{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);cursor:pointer}
.w.m{color:var(--warn);text-decoration:underline wavy var(--warn);text-underline-offset:.35em;text-decoration-thickness:1.5px}
.w.u{color:var(--fg);text-decoration:underline dotted var(--unsure);text-underline-offset:.35em}
.hz-live{margin:12px 0 0;padding:10px 12px;border-radius:12px;border:1px dashed var(--line);min-height:48px;direction:rtl;font-family:var(--ar);font-size:19px;line-height:1.8;color:var(--muted)}
.hz-live:empty::before{content:attr(data-empty);direction:ltr;display:block;font-family:var(--ui);font-size:13.5px}
.hz-status{font-size:13.5px;color:var(--muted);margin-top:8px}
.mic{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mic svg{width:28px;height:28px}
.mic.live{background:var(--bad);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--bad) 18%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{font-style:normal;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.sum div{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;background:var(--bg)}
.sum b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.sum small{color:var(--muted);font-size:12px}
.mist{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.mist li{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.mist .k{font-size:12px;font-weight:700;letter-spacing:.04em;min-width:64px}
.mist .ar{font-family:var(--ar);font-size:21px;direction:rtl}
.k.u{color:var(--unsure)}.k.e{color:var(--bad)}.k.m{color:var(--warn)}.k.x{color:var(--bad)}
.dock.hz .read-only{display:none}
.dock:not(.hz) .hz-only{display:none}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
/* ---------- Cover, home and panels ---------- */
:root{--gold:#c8a14b;--gold-hi:#ecd593;--gold-lo:#8b6a26}
:root[data-home="hijau"]{--h-bg:#0c3a2b;--h-bg2:#082a1f;--h-ink:#f3ead2;--h-mute:#b9c7b4}
:root[data-home="hitam"]{--h-bg:#161512;--h-bg2:#0d0c0a;--h-ink:#f1e7cc;--h-mute:#b3ab96}
:root[data-home="biru-muda"]{--h-bg:#dcebf5;--h-bg2:#c7dceb;--h-ink:#16324a;--h-mute:#4d6478}
:root[data-home="pastel"]{--h-bg:#dcefe2;--h-bg2:#c6e2cf;--h-ink:#173a2a;--h-mute:#4c6a5a}
:root[data-home="biru"]{--h-bg:#13233c;--h-bg2:#0b172a;--h-ink:#efe6cf;--h-mute:#aab4c4}
:root[data-home="gading"]{--h-bg:#f1e6cc;--h-bg2:#e5d6b2;--h-ink:#1f3a2e;--h-mute:#6b6450}
:root:is([data-home="gading"],[data-home="biru-muda"],[data-home="pastel"]) :is(.home,.panel){--gold:#9c7428;--gold-hi:#7a5a17}
:root:is([data-home="gading"],[data-home="biru-muda"],[data-home="pastel"]) :is(.home,.panel)::before{opacity:.16}
.cover{--cv:#123f2e;--lat:var(--lat-hijau);position:fixed;inset:0;z-index:70;perspective:1600px;background:var(--cv);cursor:pointer;-webkit-tap-highlight-color:transparent}
.cover[hidden]{display:none}
.cover-leaf{position:absolute;inset:0;transform-origin:left center;transition:transform .95s cubic-bezier(.6,.05,.3,1),opacity .95s;background:var(--cv);box-shadow:inset 14px 0 22px -10px rgba(0,0,0,.9);overflow:hidden}
.cover[data-cc="hitam"]{--lat:var(--lat-hitam)}.cover[data-cc="biru"]{--lat:var(--lat-biru)}.cover[data-cc="biru-muda"]{--lat:var(--lat-biru-muda)}.cover[data-cc="pastel"]{--lat:var(--lat-pastel)}.cover[data-cc="gading"]{--lat:var(--lat-gading)}
.cover-leaf::before{content:"";position:absolute;inset:0;opacity:.55;background-image:var(--lat);background-size:84px 84px;background-position:center}
.cover[data-light] .cover-leaf::before{opacity:.8}
.cover-fr{position:absolute;inset:calc(var(--sat,0px) + 4px) calc(var(--sar,0px) + 4px) calc(var(--sab,0px) + 4px) calc(var(--sal,0px) + 4px);container-type:size}
/* The cover is Azli's own picture (13-14 Oct 2026), in pieces so it fits any screen without gaps: the top (bar, corner
   flowers), the medallion with the title, and the bottom (flowers, bar) are cut out with soft edges and laid on a
   background woven from the picture's own damask (art/cover/quilt.py); the frame's sides repeat between the corners.
   On a tall phone the medallion and title stay together in the middle, and the extra height goes above and below them. */
/* Wide screens (landscape, tablets): the picture keeps its height and the cover grows sideways. The corner flowers stay
   in the corners, the medallion stays in the middle, the bars run longer, and the damask fills the space between. */
.cv-book{--k:min(calc(100cqw / 1146),calc(100cqh / 2201));position:absolute;left:0;top:50%;transform:translateY(-50%);width:100%;height:min(100%,calc(2201 * 1.35 * var(--k)));pointer-events:none}
.cv-book > *{position:absolute;display:block}
.cv-dm{left:calc(84 * var(--k));right:calc(84 * var(--k));top:0;bottom:0;background-size:calc(1590 * var(--k) / .6) auto;background-position:center;background-repeat:repeat}
.cv-bars{top:calc(102 * var(--k));bottom:calc(102 * var(--k));width:calc(84 * var(--k));background-repeat:repeat-y;background-size:calc(1146 * var(--k)) auto}
.cv-bars.l{left:0;background-position:left top}.cv-bars.r{right:0;background-position:right top}
.cv-ht,.cv-hb{left:calc(102 * var(--k));right:calc(102 * var(--k));height:calc(102 * var(--k));background-size:calc(146 * var(--k)) 100%;background-repeat:repeat-x;background-position:center}
.cv-ht{top:0}.cv-hb{bottom:0}
/* clips of the top and bottom pieces: left, centre and right; on a phone they meet exactly and show the picture whole */
.cv-c{overflow:hidden;height:calc(var(--h) * var(--k));width:calc(var(--w) * var(--k))}
.cv-c > img{position:absolute;top:0;width:calc(1146 * var(--k));height:auto}
.cv-cl{left:0;--w:500}.cv-cl > img{left:0}
.cv-cr{right:0;--w:500}.cv-cr > img{right:0}
.cv-cc{left:calc(50% - 143 * var(--k));--w:286}.cv-cc > img{left:calc(-430 * var(--k))}
.cv-top{top:0;--h:640}.cv-bot{bottom:0;--h:621}
.cv-cl{-webkit-mask-image:linear-gradient(to bottom,#000 calc(102 * var(--k)),transparent calc(102 * var(--k))),linear-gradient(to right,#000 calc(440 * var(--k)),transparent);-webkit-mask-composite:source-over;mask-composite:add}
.cv-cr{-webkit-mask-image:linear-gradient(to bottom,#000 calc(102 * var(--k)),transparent calc(102 * var(--k))),linear-gradient(to left,#000 calc(440 * var(--k)),transparent);-webkit-mask-composite:source-over;mask-composite:add}
.cv-bot.cv-cl,.cv-bot.cv-cr{-webkit-mask-image:linear-gradient(to top,#000 calc(102 * var(--k)),transparent calc(102 * var(--k))),linear-gradient(to right,#000 calc(440 * var(--k)),transparent)}
.cv-bot.cv-cr{-webkit-mask-image:linear-gradient(to top,#000 calc(102 * var(--k)),transparent calc(102 * var(--k))),linear-gradient(to left,#000 calc(440 * var(--k)),transparent)}
.cv-cc{-webkit-mask-image:linear-gradient(to right,transparent,#000 calc(40 * var(--k)),#000 calc(246 * var(--k)),transparent)}
.cv-pm{left:calc(50% - 489 * var(--k));width:calc(978 * var(--k));top:calc(440 * var(--k) + (100% - 2201 * var(--k)) / 2)}
.cv-pm img{display:block;width:100%}
/* Landscape: the medallion on the left and the title on the right, larger, between the corner flowers. */
.cv-med,.cv-ttl{display:none;overflow:hidden}
.cv-med > img,.cv-ttl > img{position:absolute;width:calc(978 * var(--f) * var(--k));height:auto}
.cv-med{--f:1.25;width:calc(1000 * var(--f) * var(--k));height:calc(1000 * var(--f) * var(--k));top:calc(50% - 500 * var(--f) * var(--k));left:calc(50% - (1000 * var(--f) + 110 + 840 * var(--f)) * var(--k) / 2);-webkit-mask-image:radial-gradient(closest-side circle,#000 93%,transparent 100%)}
.cv-med > img{left:calc(12 * var(--f) * var(--k));top:calc(7 * var(--f) * var(--k))}
.cv-ttl{--f:1.25;width:calc(840 * var(--f) * var(--k));height:calc(300 * var(--f) * var(--k));top:calc(50% - 230 * var(--f) * var(--k));left:calc(50% - (1000 * var(--f) + 110 + 840 * var(--f)) * var(--k) / 2 + (1000 * var(--f) + 110) * var(--k));overflow:visible}
.cv-ttl > .cv-tc{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);-webkit-mask-composite:source-in;mask-composite:intersect}
.cv-ttl > .cv-tc > img{position:absolute;width:calc(978 * var(--f) * var(--k));left:calc(-100 * var(--f) * var(--k));top:calc(-1010 * var(--f) * var(--k))}
.cv-ttl .cv-name{top:calc(300 * var(--f) * var(--k));font-size:calc(75 * var(--f) * var(--k))}
@container (min-aspect-ratio: 13/10){
  .cv-pm{display:none}.cv-med,.cv-ttl{display:block}
}
@container (min-aspect-ratio: 19/10){ .cv-med,.cv-ttl{--f:1.6} }
.cv-g .cv-dm{display:none}
/* Other colours: the picture's light and shade (luminosity) in the chosen colour, with its gold laid back on top. */
.cover .cover-fr{background:var(--cv)}   /* every colour, green too, is the Home colour behind the cover art (Azli, 18 Oct 2026) */
.cover .cv-b{mix-blend-mode:luminosity}
.cover[data-cc="hijau"] .cv-b{filter:brightness(1.7)}
.cover[data-cc="hitam"] .cv-b{filter:brightness(1.15)}
.cover[data-cc="biru"] .cv-b{filter:brightness(1.8)}
.cover:is([data-cc="biru-muda"],[data-cc="pastel"],[data-cc="gading"]) .cv-b{filter:invert(1) contrast(.85) brightness(1.02)}
.cover[data-light] .cv-g{filter:brightness(.78) saturate(1.25) contrast(1.12)}

<script>
"use strict";
/* ============================ DATA ============================ */
const D = JSON.parse(document.getElementById('qdata').textContent);
const A = D.A;               // [surah, ayah, uthmani, imlaei, page, juz, ms, en, enFootnotes, wordmap|0]
const S = D.S;               // [arName, latinName, msMeaning, enMeaning, M|D, ayahCount]
const N = A.length;
const surahStart = []; A.forEach((a,g)=>{ if(a[1]===1) surahStart[a[0]] = g; });
const pageStart = []; A.forEach((a,g)=>{ if(pageStart[a[4]]===undefined) pageStart[a[4]] = g; });
pageStart[605] = N;
const rukuStarts = new Set(D.R.map(([s,v])=>surahStart[s]+v-1));
const BASMALA = A[0][2];
const AR_DIG = '٠١٢٣٤٥٦٧٨٩';
const arNum = n => String(n).replace(/\d/g, d=>AR_DIG[d]);
const gOf = (s,v)=> surahStart[s]+v-1;
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============================ STATE ============================ */
const store = {
  get(k,d){ try{ const v=localStorage.getItem('mpq.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ if(SYNC_MAPS.has(k) && !window.__syncApplying) syncTomb(k,v); try{ localStorage.setItem('mpq.'+k, JSON.stringify(v)); }catch(e){} if(SYNC_KEYS.has(k)) syncTouch(k); }
};
/* ============================ SYNC BETWEEN DEVICES (Azli, 17 Oct 2026) ============================
   Bookmarks, notes and last-read places are kept the same on the person's phone and tablet through one file they choose
   in Google Drive (Android keeps the app's permission to it). Each item carries the time it was changed, so the newer one
   wins when both devices changed: whole bookmark and note lists are merged entry by entry. */
const SYNC_KEYS=new Set(['bm','ktBm','sirahBm','duaBm','solatBm','jumBm','notes','page','ktLast','ktLastBy','sirahLast','duaLast','solatLast','jumLast','myr','myb','hist','myPlaces']);
const SYNC_MAPS=new Set(['bm','ktBm','sirahBm','duaBm','solatBm','jumBm','notes','ktLastBy']);
let syncTm=0, syncBusy=false;
function syncTimes(){ try{ return JSON.parse(localStorage.getItem('mpq.__syncT')||'{}'); }catch(e){ return {}; } }
function syncTouch(k){ if(window.__syncApplying) return; const t=syncTimes(); t[k]=Date.now(); try{ localStorage.setItem('mpq.__syncT',JSON.stringify(t)); }catch(e){} const d=(k==='page'||k==='hist'||/Last/.test(k))?60000:4000;   // reading moves the page often: do not sync on every turn
  if(syncTm && d>=syncDue-Date.now()) return; clearTimeout(syncTm); syncDue=Date.now()+d; syncTm=setTimeout(()=>{ syncTm=0; syncNow(false); },d); }
let syncDue=0;
const syncOn=()=>!!(window.AndroidExtra?.syncRead && window.AndroidExtra.syncName());
const syncEntT=e=>{ if(!e||typeof e!=='object') return 0; for(const f of ['u','t','c']) if(typeof e[f]==='number') return e[f]; return 0; };
/* A removed bookmark or note leaves a dated "tombstone", so the other device removes it too instead of bringing it back. */
function syncDels(){ try{ return JSON.parse(localStorage.getItem('mpq.__syncDel')||'{}'); }catch(e){ return {}; } }
function syncTomb(k,v){ let old=null; try{ old=JSON.parse(localStorage.getItem('mpq.'+k)||'null'); }catch(e){} if(!old||typeof old!=='object') return;
  const gone=Object.keys(old).filter(id=>!v||!(id in v)); if(!gone.length) return; const D=syncDels(); D[k]=D[k]||{}; const now=Date.now(); gone.forEach(id=>D[k][id]=now);
  try{ localStorage.setItem('mpq.__syncDel',JSON.stringify(D)); }catch(e){} }
function syncMergeMap(L,R,del){ const out={}; L=L||{}; R=R||{}; del=del||{};
  new Set([...Object.keys(L),...Object.keys(R)]).forEach(id=>{ const a=L[id], b=R[id]; const e=a&&b?(syncEntT(b)>syncEntT(a)?b:a):(a||b);
    if(!(del[id] && del[id]>=syncEntT(e))) out[id]=e; });
  return out; }
const syncCalls={}; let syncSeq=0;
window.__syncDone=(id,v)=>{ const f=syncCalls[id]; delete syncCalls[id]; f&&f(v); };
/* Read / write the sync data off the page's thread (older app builds only have the blocking calls). */
function syncIO(op,text){ const X=window.AndroidExtra;

const UNIFY={'آ':'ا','أ':'ا','إ':'ا','ٱ':'ا','ؤ':'و','ئ':'ي','ى':'ي','ة':'ه','ـ':''};
function normAr(t){ let o=''; for(const ch of t){ const c=ch.charCodeAt(0);
  if((c>=0x610&&c<=0x61A)||(c>=0x64B&&c<=0x65F)||c===0x670||(c>=0x6D6&&c<=0x6ED)) continue;
  const u=UNIFY[ch]; const x=u!==undefined?u:ch;
  if(x===' '||/\s/.test(x)) o+=' '; else if(x && x.charCodeAt(0)>=0x600 && x.charCodeAt(0)<=0x6FF) o+=x; }
  return o.split(/\s+/).filter(Boolean).join(' '); }

function startVoiceSearch(){
  const info=document.getElementById('sinfo'), q=document.getElementById('sq'), mic=document.getElementById('vsMic');
  if(!SR){ info.textContent='Voice search is not available in this browser. Use Chrome, or the Android app.'; return; }
  let finalText=''; vsHeard=''; vsSearched=''; vsScore=0; vsTried=false;
  vsRec=new SR(); vsRec.lang=VS_LANG[vsLang][0]; vsRec.continuous=false; vsRec.interimResults=true;
  // Auto in the Android app: Google listens for Arabic, Malay and English together
  if(vsLang==='auto' && IS_ANDROID_APP) vsRec.langs='ar-SA,ms-MY,en-US';
  vsRec.onstart=()=>{ mic.classList.add('live'); info.textContent=VS_LANG[vsLang][1]+(vsLang==='auto'&&!IS_ANDROID_APP?' (in this browser Auto listens for Arabic)':'')+' Tap the mic again to search.'; };
  vsRec.onresult=ev=>{ let fin='', inter=''; for(let i=0;i<ev.results.length;i++){ const t=ev.results[i][0].transcript; if(ev.results[i].isFinal) fin+=t+' '; else inter+=t+' '; }
    if(fin.trim()) finalText=fin.trim(); const h=(fin+inter).trim(); if(h){ vsHeard=h; q.value=h; } };
  vsRec.onerror=ev=>{ const m={'not-allowed':'Microphone access is blocked. Allow it, or type instead.','service-not-allowed':'Speech recognition is blocked here. Type instead.','network':'Voice search needs internet.','no-speech':'Nothing heard. Tap the mic and try again.','audio-capture':'No microphone found.'}[ev.error]; if(m) info.textContent=m; };
  vsRec.onend=()=>{ mic.classList.remove('live'); vsRec=null; const t=(finalText.length>=vsHeard.length?finalText:vsHeard).trim(); if(!t) return; q.value=t; voiceSearchNow(t, true); };
  try{ vsRec.start(); }catch(e){ vsRec=null; info.textContent='Could not start the microphone.'; }
}
/* Search what was heard. Melayu / English: search that translation only. Arabic script: match it to an ayah.
   Auto: Google is asked for Arabic first; if that does not match an ayah, the same audio is recognised again in Malay
   and in English (Android 13+), and the language that finds ayat wins. */
function voiceSearchNow(t, final){ t=(t||'').trim(); if(!t) return; const same=(t===vsSearched); vsSearched=t;
  if(vsLang==='ms'||vsLang==='en'){ if(!same) runSearch(t, true, vsLang); return; }
  if(!/[\u0600-\u06FF]/.test(t)){ if(!same) runSearch(t, true, null); return; }
  const score = same ? (vsScore||0) : (vsScore = voiceArabicSearch(t)||0);
  if(vsLang==='auto' && final && score<0.6 && IS_ANDROID_APP && !vsTried) autoOtherLanguages(t); }

function replayOnce(lang){ return new Promise(res=>{ let fin='', last=''; const tm=setTimeout(()=>res((fin||last).trim()), 9000);
  const obj={ onstart(){}, onerror(){}, onresult(ev){ const r=ev.results[0]; const t=r[0].transcript.trim(); if(!t) return; if(r.isFinal) fin=t; else last=t; },

/* ---- Transliteration (Quran.com), loaded when switched on, kept on the phone ---- */
/* ---- Data files kept in this app's GitHub repository, saved on the phone after first use (cache "mpq-tafsir") ----
   One loader for all of them. Order: the copy beside the page (GitHub Pages), GitHub Pages, then jsDelivr's copy of the repo.
   o.ok(j): the file is the expected shape. o.v: a version; a kept copy with another version is replaced (kutub).
   o.fresh: always ask the network first (small files that change). o.revalidate: use the kept copy now and check
   for a newer one in the background, so corrected data reaches the phone on the next open. o.stale(j): a kept copy
   to use only when offline. o.nullOn404: a file that does not exist is an answer (null), not an error. */
const DL_GH='https://azali69.github.io/my-personal/', DL_CDN='https://cdn.jsdelivr.net/gh/azali69/my-personal@main/';
function dlBases(dir,wide){ const b=[]; if(/github\.io$/.test(location.hostname) || (wide && !window.AndroidSpeech && /^https?:/.test(location.protocol))) b.push(dir+'/');
  b.push(DL_GH+dir+'/',DL_CDN+dir+'/'); return b; }
async function dlGet(dir,path,o={}){ const base='https://mpq.local/'+dir+'/'+path, q=o.v?'?v='+o.v:'', id=base+q; let c=null;
  const good=j=>!o.ok||o.ok(j);
  const keep=async r=>{ try{ if(c){ if(o.v) for(const k of await c.keys(base,{ignoreSearch:true})) if(k.url!==id) await c.delete(k); await c.put(id,r); } }catch(e){} };
  try{ c=await caches.open('mpq-tafsir'); }catch(e){}
  if(!o.fresh){ try{ const r=c&&await c.match(id); if(r){ const j=await r.json(); if(good(j) && !(o.stale&&o.stale(j))){
      if(o.revalidate) (async()=>{ for(const b of dlBases(dir,o.wide)){ try{ const n=await fetch(b+path+q,{cache:'no-cache'}); if(!n.ok) continue; if(good(await n.clone().json())) await keep(n); return; }catch(e){} } })();
      return j; } } }catch(e){} }

  return [[n(g('bm',{})),"Qur'an bookmarks"],[n(g('ktBm',{})),'hadith bookmarks'],[n(g('sirahBm',{})),'Sirah bookmarks'],[n(g('notes',{})),'notes'],[n(g('myr',[]))+n(g('myb',[])||[]),"My ruku' and My blocks"],[n(g('hist',[])),'Hafazan results'],[n(g('myPlaces',[])),'own places (Masjid & musollah)']]
    .map(([c,l])=>`${c} ${l}`).join(' · ') + ` · ${Object.keys(data).length} saved settings in all`; }
function backupSheet(){ const now=backupCollect();
  openSheet('Backup and restore', `
   <p class="note" style="margin-top:0">One file with everything you set and saved in the app: ${esc(backupSummary(now.data))}.</p>
   <div class="actions"><button id="bkSave">${ic('copy')}Save a backup file</button><button id="bkLoad">${ic('hist')}Restore from a backup file</button><button id="bkSync">${ic('hist')}Sync with your other devices (Google)…</button></div>
   <p class="note">Save it somewhere safe, e.g. Google Drive or email it to yourself. Restoring replaces what is in the app now with the backup.</p>
   <p class="note" style="font-size:12px">Not in the backup: your Hafazan voice recordings and the adhan sound files you chose (pick those again), and the downloaded tafsir, hadith and word-by-word texts, which download again when needed.</p>
   <input type="file" id="bkFile" accept="application/json,.json" hidden>`);
  const d=new Date(), name=`MyPersonalQuran-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  sheetB.querySelector('#bkSync').onclick=()=>syncSheet();
  sheetB.querySelector('#bkSave').onclick=()=>{ const text=JSON.stringify(backupCollect());
    if(window.AndroidExtra?.saveBackup){ window.__backupSaved=ok=>{ window.__backupSaved=null; toast(ok?'Backup saved':'Backup not saved'); if(ok) store.set('lastBackup',Date.now()); };
      goingAway(); window.AndroidExtra.saveBackup(name,text); return; }
    try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); store.set('lastBackup',Date.now()); toast('Backup file downloaded'); }
    catch(e){ toast('Could not save the file here'); } };
  sheetB.querySelector('#bkLoad').onclick=()=>{
    if(window.AndroidExtra?.openBackup){ window.__backupOpened=ok=>{ window.__backupOpened=null; if(!ok){ toast('No file read'); return; } backupRestore(window.AndroidExtra.takeBackup()); };
      goingAway(); window.AndroidExtra.openBackup(); return; }
    const f=sheetB.querySelector('#bkFile'); f.onchange=()=>{ const file=f.files&&f.files[0]; if(!file) return; file.text().then(backupRestore).catch(()=>toast('Could not read the file')); }; f.click(); }; }
function backupRestore(text){ let o=null; try{ o=JSON.parse(text); }catch(e){}
  if(!o || o.app!=='My Personal Quran' || o.kind!=='backup' || !o.data || typeof o.data!=='object'){ toast('This is not a My Personal Quran backup file'); return; }
  const when=o.at? new Date(o.at).toLocaleString() : 'unknown date';
  appConfirm(`Restore the backup from ${when}?\n\n${backupSummary(o.data)}\n\nThis replaces the settings, bookmarks and notes in the app now.`,'Restore').then(yes=>{ if(yes) backupApply(o); }); }
function backupApply(o){
  const keep=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith('mpq.')) keep.push(k); }
  try{ keep.forEach(k=>localStorage.removeItem(k)); Object.entries(o.data).forEach(([k,v])=>{ if(typeof v==='string') localStorage.setItem('mpq.'+k,v); }); }
  catch(e){ toast('Restore failed: the phone storage is full'); return; }
  store.set('restoredAt',Date.now()); toast('Restored. Reopening the app…'); setTimeout(()=>location.reload(),700); }
/* ---- Tafsir ----
   Texts from QuranEnc.com, shown unchanged (their terms: no changes, name the publisher and source).
   Kept in this app's GitHub repository by a monthly job (tools/fetch_tafsir.py) and saved on the phone after first use. */
const TAFSIRS=[
  ['indonesian_mokhtasar','Al-Mukhtasar','Bahasa Indonesia','Tafsir Center for Quranic Studies (Markaz Tafsir)','arabic_mokhtasar'],
  ['english_mokhtasar','Al-Mukhtasar','English','Tafsir Center for Quranic Studies (Markaz Tafsir)','arabic_mokhtasar'],
  ['indonesian_saadi','As-Sa\'di','Bahasa Indonesia','Shaykh Abdurrahman bin Nasir as-Sa\'di','arabic_saadi']];
const tafMem=new Map();
async function tafLoad(key,s){ const id=key+'/'+p3(s)+'.json'; if(tafMem.has(id)) return tafMem.get(id);
  const j=await dlGet('tafsir',id,{ok:j=>!!j&&(Array.isArray(j.ayat)||Array.isArray(j.blocks)),revalidate:true}); tafMem.set(id,j); return j; }
let tafMeta=null;
async function tafIndex(){ if(tafMeta) return tafMeta; try{ tafMeta=await dlGet('tafsir','index.json',{fresh:true}); return tafMeta; }catch(e){ return {}; } }
function tafsirSheet(g){
  let key=store.get('tafsir', st.lang==='en'?'english_mokhtasar':'indonesian_mokhtasar'); if(!TAFSIRS.some(t=>t[0]===key)) key='indonesian_mokhtasar';
  let showAr=store.get('tafsirAr',false);
  const draw=async()=>{ const a=A[g], s=a[0], T=TAFSIRS.find(t=>t[0]===key);
    openSheet(`Tafsir · ${S[s-1][1]} ${s}:${a[1]}`, `
     <div class="seg" id="tfK" style="margin-top:0">${TAFSIRS.map(t=>`<button data-k="${t[0]}" aria-pressed="${t[0]===key}">${t[1]} · ${t[2]==='English'?'English':'Indonesia'}</button>`).join('')}</div>
     <div class="arl" dir="rtl" style="margin:14px 0 6px;font-size:24px;line-height:1.9">${a[2]}<span class="num">${arNum(a[1])}</span></div>
     ${st.tl!=='off'&&TL[st.tl]?`<div class="note" style="font-style:italic;color:var(--accent);margin:-2px 0 10px">${esc(tlText(g))}</div>`:''}
     <div id="tfT" class="note" dir="auto" style="font-family:var(--ui),var(--ar);font-size:16px;line-height:1.7;color:var(--ink);white-space:pre-wrap">Loading…</div>
     <div id="tfA" dir="rtl" lang="ar" style="display:${showAr?'block':'none'};white-space:pre-wrap;font-family:var(--ar),serif;font-size:19px;line-height:1.9;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"></div>
     <div class="row2" style="margin-top:14px;flex-wrap:wrap;gap:8px">
      <button class="pill" id="tfP" ${g<=0?'disabled':''}>‹ Previous ayah</button>
      <button class="pill" id="tfN" ${g>=A.length-1?'disabled':''}>Next ayah ›</button>
      <button class="pill" id="tfR" aria-pressed="${showAr}">${showAr?"Hide Arabic original":"Show Arabic original"}</button></div>
     <p class="note" id="tfS" style="font-size:12px;margin-top:14px">${esc(T[1])} (${esc(T[2])}) · ${esc(T[3])}. Source: <a href="https://quranenc.com/en/browse/${T[0]}" target="_blank" rel="noopener">QuranEnc.com</a>, shown without changes.</p>`);
    sheetB.querySelector('#tfK').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; key=b.dataset.k; store.set('tafsir',key); draw(); };
    sheetB.querySelector('#tfP').onclick=()=>{ if(g>0){ g--; draw(); } };
    sheetB.querySelector('#tfN').onclick=()=>{ if(g<A.length-1){ g++; draw(); } };
    sheetB.querySelector('#tfR').onclick=()=>{ showAr=!showAr; store.set('tafsirAr',showAr); draw(); };
    const put=(id,txt)=>{ const el=document.getElementById(id); if(el && sheetB.contains(el)) el.textContent=txt; };
    const pick=(j,n)=>{
      if(j.blocks){ // As-Sa'di: explanations may cover several ayat together
        const b=j.blocks.find(x=>x[0]<=n && n<=x[1]);
        if(!b) return 'This tafsir has no separate explanation for this ayah (for example, letters at the start of a surah). See the ayah before or after it.';
        const head = b[1]>b[0] ? `(Ayat ${b[0]}–${b[1]} are explained together.)\n\n` : '';
        const intro = (n===1 && j.intro && j.intro.length) ? j.intro.join('\n\n')+'\n\n' : '';
        return intro + head + (b[2] ? b[2]+'\n\n' : '') + b[3]; }
      const r=j.ayat.find(x=>x[0]===n); if(r && r[1] && r[1].trim()) return r[1]+(r[2]?'\n\n'+r[2]:'');
      return 'No explanation for this ayah in this tafsir.'; };
    try{ const j=await tafLoad(key,s); if(A[g][0]!==s) return; put('tfT', pick(j,a[1])); }
    catch(e){ put('tfT','Could not load the tafsir. It needs the internet the first time; after that this surah is saved on the phone.'); }
    if(showAr){ try{ const j=await tafLoad(T[4],s); put('tfA', pick(j,a[1])); }catch(e){ put('tfA','Could not load the Arabic original.'); } }
    tafIndex().then(m=>{ const x=m[key]; const el=document.getElementById('tfS'); if(x && x.retrieved && el && sheetB.contains(el)) el.insertAdjacentText('beforeend',` Retrieved ${x.retrieved}.`); });
  };
  draw(); }

function saveRange(lo,hi,k,render=true){ addMyBlock(lo,hi,k); st.blocks = k==='myr'?'myruku':'mine'; store.set('lastBlocks',st.blocks); save(); syncBlkBtn();

let offRun=0;
async function saveOffline(set){
  const my=++offRun, msg=()=>document.getElementById('offMsg'); let ok=0, fail=0;
  for(let p=1;p<=604 && my===offRun;p++){
    try{ const r=await fetch(fontUrl(set,p),{mode:'cors'}); if(r.ok){ await r.arrayBuffer(); ok++; } else fail++; }catch(e){ fail++; }
    const m=msg(); if(m) m.textContent=`Saving pages: ${p} of 604${fail?` (${fail} failed)`:''}`;
  }
  const m=msg(); if(m && my===offRun) m.textContent = fail? `Saved ${ok} pages. ${fail} failed; try again with a steady connection.` : 'All 604 pages are saved for offline reading.';
}

/* ============================ LISTEN & REPEAT (talaqqi) ============================
   The reciter recites one part (a whole ayah, or from one waqf sign to the next), then stops. The learner recites it back
   while it is recorded; on Stop, the words are checked and both recordings can be played. Then the learner chooses: repeat or go on.
   Word checking hears the words only; tajwid (makhraj, mad, ghunnah) is for the learner's own ear, comparing the two recordings. */
const TQ_STOP=new Set(['ۘ','ۗ','ۚ','ۖ']);   // waqf signs where a reciter may stop: lazim, qili, jaiz, sala

  // very short parts (under 3 words) are joined to the next one

  const out=[]; for(const c of cut){ if(out.length && words(out[out.length-1])<3) out[out.length-1][1]=c[1]; else out.push(c.slice()); }
  if(out.length>1 && words(out[out.length-1])<3){ const l=out.pop(); out[out.length-1][1]=l[1]; }
  return out.map(([t0,t1])=>({g,t0,t1})); }

  el.querySelectorAll('.tq-res-play').forEach(b=>b.onclick=()=>{ if(b.dataset.k==='me'){ const a=document.getElementById('tqMe'); if(a){ try{ tqA.pause(); }catch(e){} a.currentTime=0; a.play(); } } else { tqPlay(true); } });

function tqReset(){ tqMicStop(false); tq.res=null; tq.H=[]; tq.recUrl=null; tq.recSec=0; tq.phase='idle'; try{ tqA.pause(); }catch(e){} }
function tqGo(d){ tqReset();
  if(d>0){ if(tq.i<tq.units.length-1) tq.i++; else { const g=tqUnit().g; if(g>=N-1){ toast('End of the Qur\'an'); return; } tq.units=tqUnits(g+1,tq.mode); tq.i=0; } }
  else { if(tq.i>0) tq.i--; else { const g=tqUnit().g; if(g<=0) return; tq.units=tqUnits(g-1,tq.mode); tq.i=tq.units.length-1; } }
  tqRender(); tqPlay(); }
/* Reciter: a whole ayah plays its own file; a waqf part plays that stretch of the reciter's surah recording, using the word timings. */
let tqRaf=0;
async function tqPlay(onlyListen){ if(!tq) return; const me=tq, u=tqUnit(), x=A[u.g], R=RECITERS[tq.rc];
  cancelAnimationFrame(tqRaf); tq.phase='play'; if(!onlyListen) tqRender(); else tqStatus('Listen to the reciter…');
  const whole = u.t0===0 && u.t1===x[2].split(' ').length-1;
  let from=0, to=null;
  try{
    if(whole || !R.qdc){ const url=R.ayah+p3(x[0])+p3(x[1])+'.mp3'; if(tqA.dataset.u!==url){ tqA.src=url; tqA.dataset.u=url; } from=0; to=null; }
    else { const tm=await plTimings(qdcFor(tq.rc,x[0]),x[0]); if(tq!==me) return; const v=tm.v.get(u.g); const o=ords(u.g);
      let k0=null,k1=null; for(let i=u.t0;i<=u.t1;i++){ if(o[i]>=0){ if(k0==null) k0=o[i]; k1=o[i]; } }
      const s0=v&&v.seg.find(z=>z[0]===k0+1), s1=v&&[...v.seg].reverse().find(z=>z[0]===k1+1);
      if(!s0||!s1) throw new Error('no timing');
      if(tqA.dataset.u!==tm.url){ tqA.src=tm.url; tqA.dataset.u=tm.url; }
      from=Math.max(0,s0[1]-120)/1000; const nx=v.seg.find(z=>z[0]===k1+2); to=(nx? Math.min(nx[1], s1[2]+250) : Math.max(s1[2]+250, v.to-40))/1000; }
  }catch(e){ if(tq!==me) return; tqStatus('Word timing is not available now. Playing the whole ayah.'); const url=R.ayah+p3(x[0])+p3(x[1])+'.mp3'; tqA.src=url; tqA.dataset.u=url; from=0; to=null; }
  const go=()=>{ if(tq!==me) return; try{ tqA.currentTime=from; }catch(e){} tqA.playbackRate=tq.spd; tqA.play().catch(err=>{ if(tq===me){ tq.phase='idle'; tqStatus(err&&err.name==='NotAllowedError'?'Tap ▶ Reciter to play.':'Could not play the recitation. Check the internet connection.'); } });
    const step=()=>{ if(tq!==me||tq.phase!=='play') return; if(to!=null && tqA.currentTime>=to){ tqA.pause(); tqEndPlay(onlyListen); return; } if(!tqA.paused) tqRaf=requestAnimationFrame(step); };
    tqRaf=requestAnimationFrame(step); };

  if(tqA.readyState>=1) go(); else tqA.addEventListener('loadedmetadata',go,{once:true}); }
function tqEndPlay(onlyListen){ if(!tq) return; tq.phase='idle';
  if(!onlyListen && tq.auto && !tq.res){ setTimeout(()=>{ if(tq && tq.phase==='idle' && !tq.res) tqMicStart(); }, 250); }
  else { tqStatus(tq.res?'':'Press the microphone to recite, or ▶ to hear it again.'); } }
function tqStatus(t){ const s=document.getElementById('tqS'); if(s) s.textContent=t; }
/* Learner: speech recognition + recording, like Hafazan */
let tqRecog=null, tqWeb=null;
function tqMicStart(){ if(!tq) return; applyMic(); if(!SR){ toast('Voice recognition is not available here.'); return; }
  tq.res=null; tq.H=[]; tq.finals=[]; tq.last=''; tq.phase='listen'; tq.recUrl=null; tqRender();
  // recording (Android app: WAV on the phone; browser: MediaRecorder)
  tq.recMode=null;

  else if(navigator.mediaDevices?.getUserMedia && window.MediaRecorder){ const me=tq; navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{ if(tq!==me||tq.phase!=='listen'){ stream.getTracks().forEach(t=>t.stop()); return; }

/* ============================ SIRAH ============================
   The life of the Prophet ﷺ as a timeline (Azli, 15 Oct 2026), from before prophethood to his death. Each event has a short
   summary written for the app, the Qur'an the hadith books or the tafsir link to it, the hadith in this app's own books (with

const ckTok=t=>fold(t||'').replace(/[^a-z0-9À-ɏ]+/g,' ').split(' ').filter(w=>w.length>2&&!CK_STOP.has(w));

function ckTriIndex(){ if(CK_TRI) return CK_TRI; const sets=[], inv=new Map();

let CK_QW=null;
function ckQwIndex(){ if(CK_QW) return CK_QW; const sets=[], df=new Map(), inv=new Map();
  for(let g=0;g<N;g++){ const s_=new Set(normAr(A[g][3]).split(' ').map(ckSk).filter(Boolean)); sets.push(s_); for(const w of s_){ df.set(w,(df.get(w)||0)+1); let l=inv.get(w); if(!l) inv.set(w,l=[]); l.push(g); } }

/* Qur'an, Malay / English: shared content words, weighted by rarity (translators word things differently). */
let CK_QT=null;
function ckQIndex(){ if(CK_QT) return CK_QT; const df=new Map(), sets={ms:[],en:[]};

function ckQuranLat(text){ const {sets,inv,idf}=ckQIndex(); const q=new Set(ckTok(text)); if(q.size<3) return [];

    const cand=[...sc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,150);
    for(const [g] of cand){ let best=null, ws=new Set();
      for(let k=0;k<3 && g+k<N && A[g+k][0]===A[g][0];k++){ for(const w of sets[L][g+k]) ws.add(w);

/* Hadith: Arabic by pairs of words in a row; Malay/English by shared content words (Malay is compared with the Indonesian).

function ckHadithScore(qp,h){

async function checkRun(text){ const run=++ckRunId, ms=sL()==='ms'; text=(text||'').trim(); ckSt.text=text;
  const msg=document.getElementById('ckMsg'), qBox=document.getElementById('ckQ'), hBox=document.getElementById('ckH'); if(!msg) return;
  qBox.innerHTML=''; hBox.innerHTML=''; ckSt.res=null;
  if(text.length<8){ msg.textContent=ms?'Teks terlalu pendek untuk disemak.':'The text is too short to check.'; return; }
  const isAr=ckIsAr(text); msg.textContent=ms?'Menyemak Al-Quran…':'Checking the Qur\'an…';
  await new Promise(r=>setTimeout(r,30));
  const qw=isAr?ckArWords(text):null;
  const qr= isAr? (()=>{ const a=ckQuranTri(text), b=ckQuranWords(text), all=a.concat(b).sort((x,y)=>(y.cov+2*y.qc)-(x.cov+2*x.qc)) /* the ayah holding most of the text first */, out=[];
    for(const w of all){ if(out.length>=6) break; if(out.length && w.cov<0.15) continue; if(out.some(o=>!(w.e<o.g||w.g>o.e))) continue; out.push(w); } return out; })() : ckQuranLat(text);
  if(run!==ckRunId) return;
  const res={isAr, q:qr.map(w=>({g:w.g,e:w.e,p:w.cov,qc:w.qc||0,n:w.L||w.n})), h:[], hDone:false, fail:0};
  ckSt.res=res; checkShow(res);
  // hadith: every kitab of the seven books (downloaded the first time, then kept on the phone)
  await sirahBooks(); if(!ktBooks){ res.hDone=true; res.fail=-1; checkShow(res); return; }
  const qp= isAr? (()=>{ const bi=new Set(); for(let i=1;i<qw.length;i++) bi.add(qw[i-1]+' '+qw[i]); return {ar:true,bi}; })() : {ar:false,w:new Set(ckTok(text))};
  if((qp.ar?qp.bi.size:qp.w.size)<4){ res.hDone=true; res.short=true; checkShow(res); return; }
  const total=ktBooks.reduce((a,k)=>a+k.sections.length,0); let done=0;
  for(const k of ktBooks){ for(const s of k.sections){ if(run!==ckRunId) return;
    let d=null; try{ d=await ktGet(`${k.id}/${s.n}.json`); }catch(e){ res.fail++; }
    done++; if(d) for(const h of d.h){ const sc=ckHadithScore(qp,h); if(sc) res.h.push({k:k.id,sn:s.n,h,sc}); }
    if(done%8===0){ const pg=document.getElementById('ckHP'); if(pg) pg.textContent=(ms?'Menyemak kitab hadis… ':'Checking the hadith books… ')+Math.round(done*100/total)+'%'; await new Promise(r=>setTimeout(r,0)); } } }
  res.h.sort((a,b)=>b.sc.s-a.sc.s); res.h=res.h.slice(0,30); res.hDone=true; if(run===ckRunId) checkShow(res); }

function checkShow(res, restored){ const ms=sL()==='ms', msg=document.getElementById('ckMsg'), qBox=document.getElementById('ckQ'), hBox=document.getElementById('ckH'); if(!msg) return;
  const ref=(g,e)=>`${S[A[g][0]-1][1]} ${A[g][0]}:${A[g][1]}${e>g?'–'+A[e][1]:''}`;
  const top=res.q[0], full=w=>w.p>=0.85, part=w=>w.p<0.5;
