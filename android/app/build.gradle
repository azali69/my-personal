plugins { id 'com.android.application' }
android {
    namespace 'net.azli.mypersonalquran'
    compileSdk 34
    defaultConfig {
        applicationId "net.azli.mypersonalquran"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName file("../../VERSION").text.trim() + "." + (System.getenv("VERSION_CODE") ?: "0")   // v<major>.<minor>.<patch>.<build>
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    signingConfigs {
        personal {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.personal
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'html', 'onnx' }
    packaging { jniLibs { pickFirsts += ['**/libc++_shared.so']; useLegacyPackaging true }
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/ASL2.0'] } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'   // Google sign-in for Drive sync
    // BOOX fast pen for the Notepad (Onyx pen SDK, as in My Personal eReader; used only on BOOX devices)
    implementation('com.onyx.android.sdk:onyxsdk-device:1.3.5.3')
    implementation('com.onyx.android.sdk:onyxsdk-pen:1.5.4.4')
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
