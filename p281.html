the *3+ million sources in libraries, few are available to those without access to elite universities and specialized libraries, and less than 1% have been digitized.* \n **• AI models mix the good with the bad, and hallucinate:** And those that are available **mix the classical sources that a Muslim scholar would recognize as authoritative** (such as Qur'an, hadith, fiqh works, historical chronicles, and court cases from recognized figures) with millions of opinions, analysis, and even false narratives about Islam. This is a problem.\n**Our Solution:** Usul solves the problems of **credibility, reliability,** and **AI-powered access to online sources** that—prior to now—have impeded researchers' ability to explore complex questions related to Islamic law, history, and more. Researchers and data engineers joined forces to create an online platform that enables advanced searches on a curated, closed, and credible collection of Islamic sources, powered by AI."])</script><script>self.__next_f.push([1,"12:[\"$\",\"$L14\",null,{\"formats\":{\"number\":{\"nogroup\":{\"useGrouping\":false}}},\"locale\":\"en-US\",\"messages\":{\"common\":{\"advanced-search\":\"Advanced Search\",\"advanced-matching\":\"Advanced Matching\",\"load-more\":\"Load More\",\"clear-all\":\"Clear all\",\"clear-filters\":\"Clear filters\",\"beta\":\"Beta\",\"search\":\"Search\",\"e-book\":\"e-Book\",\"pdf\":\"PDF\",\"url\":\"URL\",\"pagination\":{\"previous\":\"Previous\",\"next\":\"Next\",\"page-x\":\"Page {page, number, nogroup}\",\"vol-x\":\"Volume {volume, number, nogroup}\",\"page-unknown\":\"Unknown page\"},\"demo\":{\"title\":\"Usul Demo\",\"description\":\"This is a demo of the Usul platform.\",\"advancedResearch\":{\"title\":\"Advanced Search\",\"description\":\"See how Usul's advanced search works.\"}},\"year-format\":{\"ah\":{\"title\":\"AH\",\"description\":\"Year in Hijri format\",\"value\":\"{year, number, nogroup} AH\"},\"ad\":{\"title\":\"AD\",\"description\":\"Year in Gregorian format ext\",\"texts\":\"Texts\",\"x-texts\":\"{count, plural, =0 {No texts} one {# Text} other {# Texts}}\",\"texts-description\":\"We host the world’s largest digital, AI-enabled library of Islamic texts, featuring sources reviewed by reputable scholars and vetted for serious Islamic research. Our advanced tools let you explore the library by author, legal school, genre, modern region, and historical empire or era—so you can find exactly what you’re looking for, with credibility and precision. Scholar-curated collections are also available to guide and deepen your research.\",\"region\":\"Region\",\"regions\":\"Regions\",\"x-regions\":\"{count, plural, =0 {No regions} one {# Region} other {# Regions}}\",\"regions-description\":\"Visually explore our vast collection by the places where texts were produced—whether by modern countries where authors wrote or by the correspondending historical regions where they lived. Click on any country to learn about its history and significance within the Islamic historical tradition.\",\"empire\":\"Empire \u0026 Era\",\"empires\":\"Empires \u0026 Eras\",\"x-empires\":\"{count, plural, =0 {No empires \u0026 eras} one {# Empire \u0026 Era} other {# Empires \u0026 Eras}}\",\"empires-description\":\"$15\",\"author\":\"Author\",\"authors\":\"Authors\",\"x-authors\":\"{count, plural, =0 {No authors} one {# Author} other {# Authors}}\",\"authors-description\":\"Search and explore authors from the world’s leading digital library of AI-enabled Islamic texts. Select an author to instantly view their complete body of work, organized by genre, region, and historical empire or era—so you can see **when** and **where** they wrote. Each author profile includes a scholarly biography, main location, full and popular names, and clear context on their influence within Islamic jurisprudence and intellectual history wherever available. You can also use the AI Chat feature to explore an author’s oeuvre in real time. \",\"name\":\"Name\",\"names\":\"Names\",\"x-names\":\"{count, plural, =0 {No names} one {# Name} other {# Names}}\",\"genre\":\"Genre\",\"genres\":\"Genres\",\"x-genres\":\"{count, plural, =0 {No genres} one {# Genre} other {# Genres}}\",\"genres-description\":\"For the first time, the full scope of Islamic knowledge—across historical and modern genres—has been comprehensively mapped. We present it to you within a single, vast library. Our researchers identified 14 core disciplines in consultation with leading scholars from the Islamic world and in the American academy. From law, language, and history to philosophy, and poetry, Islamic scholarship stands out as one of the richest intellectual traditions in human history. Our platform lets you explore every author, book, and idea within its proper scholarly context—revealing how works relate across fields and genres. Simply select a discipline to view its subfields and a curated collection of texts. You can also use AI Chat to explore each field’s collection and nuances in real time.\",\"x-results\":\"{count, plural, =0 {No results} one {# Result} other {# Results}}\",\"century\":\"Century\",\"centuries\":\"Centuries\",\"collection\":\"Collection\",\"collections\":\"Collections\",\"x-collections\":\"{count, plural, =0 {No collections} one {# Collection} other {# Collections}}\",\"x-centuries\":\"{count, plural, =0 {No centuries} one {# Century} other {# Centuries}}\",\"ordinal-century\":\"{count, selectordinal, one {#st} two {#nd} few {#rd} other {#th}} Century\",\"year\":\"Year\",\"years\":\"Years\",\"x-years\":\"{count, plural, one {One year} other {# Years}}\",\"chat\":\"Chat\",\"chats\":\"Chats\",\"content\":\"Content\",\"search-for\":\"Search for a {entity}\",\"search-within\":\"Search in {entity}...\",\"search-x\":\"Search {count, number} {entity}\",\"no-entity\":\"No {entity} found\",\"metadata-access-title\":\"Metadata browsing requires a subscription\",\"metadata-access-description\":\"Explore authors, genres, regions, empires, and eras with a Star  plan\",\"quota-limit-reached-paid\":\"You have reached your token limit, upgrade your plan\",\"send-message\":\"Send message\",\"new-chat\":\"New Chat\",\"share-chat\":\"Share Chat\",\"copy\":\"Copy to clipboard\",\"copied\":\"Copied to clipboard!\",\"regenerate\":\"Regenerate\",\"mark-as-correct\":\"Mark as correct\",\"report-as-incorrect\":\"Report as incorrect\",\"sources\":\"Sources\",\"error\":\"Something went wrong. \u003cretry\u003eTry again\u003c/retry\u003e or \u003ccontact\u003econtact us\u003c/contact\u003e if it persists.\",\"pg-x\":\"P{page, number, nogroup}\",\"pg-x-vol\":\"Vol {vol, number, nogroup}, Pg {page, number, nogroup}\",\"translate\":\"Translate\",\"show-original\":\"Show original\",\"here\":\"here\"},\"edition\":\"Edition\",\"editions-modal\":{\"title\":\"Editions\",\"description\":\"Select the desired edition\"},\"select-edition\":\"Select an edition\",\"single-page\":\"Single Page\",\"all-pages\":\"All Pages\",\"other-titles\":\"Other titles\",\"more-info\":\"Book Info\",\"external-book\":{\"title\":\"Good news!\",\"description\":\"This book is not available on Usul but we found an edition somewhere else.\",\"navigate\":\"Navigate\"},\"no-versions\":{\"title\":\"No versions available\",\"description\":\"This book has no versions available.\"},\"download-pdf\":\"Download PDF\",\"publication-details\":{\"title\":\"Publication Details\",\"investigator\":\"Editor\",\"publisher\":\"Publisher\",\"publication-year\":\"Publication Year\",\"publisher-location\":\"Publisher Location\",\"edition-number\":\"Edition\"},\"feedback-submitted\":\"Feedback submitted!\"},\"meta\":{\"global\":{\"usul\":\"Usul\",\"slogan\":\"The Research tool for Islamic Texts\",\"description\":\"AI-powered access to over 15,000 texts including all of Shamela\"},\"author-page\":{\"title\":\"{author} | Books and Texts\",\"description-secondary\":\"Read {author}'s books. {author}, also known as {authorSecondary},authored {books} books.\",\"description\":\"Read {author}'s books. {author} authored {books} books.\"},\"about-page\":{\"title\":\"About Usul\",\"description\":\"Learn about Usul\"},\"team-page\":{\"title\":\"Team\",\"description\":\"Meet the Usul team\"},\"donate-page\":{\"title\":\"Donate\",\"description\":\"Donate to Usul\"},\"profile-page\":{\"title\":\"Profile\",\"description\":\"Your profile\"},\"collections-page\":{\"title\":\"Collections\",\"description\":\"Your collections\"},\"form-page\":{\"title\":\"Form\",\"description\":\"Form\"},\"plans-page\":{\"title\":\"Plans\",\"description\":\"Plans\"}},\"about\":{\"about\":\"About\",\"hero\":{\"title\":\"The Future of Islamic Research\",\"imageAlt\":\"About Usul\",\"paragraph1\":\"**The Vision:** Usul is an AI-powered platform designed to evolve how Islamic research is done in the twenty-first century, at a time when online research and AI technology are fueling tomorrow's world. \\n**The Problem:** But the public lacks easy access to a single site of online sources for Islamic knowledge, much less sites that combine windows for Islamic research with the latest AI technology.\\n **• Leading AI platforms give unreliable answers on Islam.** Moreover, advances in AI that make ChatGPT, Gemini, Claude and other sites so useful for general knowledge **do not yet give reliable or credible answers for the universe of Islamic knowledge**—where credibility and reliability are at a premium.\\n **• AI Models are missing Islamic sources.** In large part, the divergence between existing AI models and Islamic research has to do with the **lack of sources:** the general models were trained on the sources available on the internet—good, bad, and ugly.\",\"paragraph2\":\"$16\",\"tryUsul\":\"Try Usul\",\"seeHowItWorks\":\"See How It Works\"},\"problem\":{\"tag\":\"The Problem\",\"title\":\"Why Islamic Knowledge Needs Better Tools\",\"description\":\"Artificial intelligence is transforming global research, but Islamic scholarship faces a unique challenge:\",\"challenge\":\"there is no unified, trustworthy digital space for accessing authentic Islamic sources.\",\"meanwhile\":\"Meanwhile, the vast majority of authoritative Islamic sources are either:\",\"notOnline\":\"Not online\",\"scannedPdfs\":\"Available only as scanned PDFs\",\"mixedContent\":\"Or Mixed with unreliable online content\"},\"story\":{\"tag\":\"Our Story\",\"title\":\"Our Journey to a Credible Digital Corpus\",\"description\":\"How Usul evolved from a simple research tool into a trusted, AI-powered platform for Islamic scholarship.\",\"roadmap\":{\"2019\":{\"tag\":\"Foundation\",\"title\":\"We began as a personal research tool.\",\"description\":\"Usul started as an early attempt to explore Islamic texts more quickly and systematically, laying the groundwork for a new digital research approach.\"},\"2023\":{\"tag\":\"AI Integration\",\"title\":\"We integrated advanced AI to enhance accuracy.\",\"description\":\"Semantic search, contextual retrieval, and tailored AI models elevated how researchers navigate complex scholarly questions.\"},\"2024\":{\"tag\":\"Institutional Launch\",\"title\":\"We opened Usul to scholars and institutions.\",\"description\":\"Our platform gained permissions, collaboration tools, and refined Arabic handling, making Usul viable for teams and academic environments.\"},\"2025\":{\"tag\":\"Expansion\",\"title\":\"We are evolving into a complete research ecosystem.\",\"description\":\"Search, chat, annotations, workspaces, corpus analysis, and cross-text insights are coming together to form a unified environment for Islamic scholarship.\"},\"2020-2022\":{\"tag\":\"Prototyping\",\"title\":\"We built structured corpora for serious research.\",\"description\":\"Internal prototypes introduced Custom Corpora, allowing researchers to organize texts by discipline and create domain-specific research collections.\"}}},\"values\":{\"tag\":\"Our Core Values\",\"title\":\"Usul grew from a simple tool into a trusted, AI-powered research platform.\",\"credibility\":{\"title\":\"Credibility\",\"description\":\"Guided by expert scholars who verify, authenticate, and curate thousands of authoritative Islamic texts.\"},\"reliability\":{\"title\":\"Reliability\",\"description\":\"Our AI engine provides fully cited, accurate results, avoiding hallucinations and ensuring every answer is grounded in trusted sources.\"},\"access\":{\"title\":\"Access\",\"description\":\"With 15,000+ machine-readable texts, Usul makes Islamic heritage accessible, searchable, and analyzable at scale.\"}},\"different\":{\"title\":\"What Makes Usul Different?\",\"description\":\"A platform built for Islamic scholarship, not general AI use cases.\",\"curatedCorpus\":\"A closed, curated corpus engineered specifically for Islamic studies\",\"fineTuned\":\"AI models fine-tuned on classical Arabic and scholarly writing\",\"citations\":\"Citations attached to every question and answer\",\"collaboration\":\"Collaboration between scholars and engineers at every step\"},\"operations\":{\"title\":\"How We Operate\",\"description\":\"Usul is a non-profit organization that works with the agility of a startup.\",\"supported\":\"Our operations are supported through:\",\"donations\":\"Major and individual donations\",\"contracts\":\"Service contracts for customized datasets, search portals, or research environments\",\"contributions\":\"Contributions of time, expertise, and scholarly guidance\"},\"nonprofit\":{\"title\":\"Nonprofit Committed\",\"status\":\"501(c)(3) pending\",\"imageAlt\":\"Nonprofit\",\"location\":\"Houston\",\"locationLabel\":\"State\",\"yearFounded\":\"2021\",\"yearFoundedLabel\":\"Year Founded\",\"teamMembers\":\"54\",\"teamMembersLabel\":\"Team Members\",\"totalFunding\":\"32M\",\"totalFundingLabel\":\"Total Founding\"}},\"team\":{\"title\":\"Meet the Team\",\"subtitle\":\"The Usul team is made up of engineers, designers, and researchers passionate about building digital tools to transform Islamic research.\",\"become-a-volunteer\":\"Become a volunteer\",\"contact-us\":\"Contact Us\",\"support-usul\":\"Support Usul.AI\",\"founders-title\":\"Founding team\",\"founders-subtitle\":\"The founding team behind Usul.\",\"engineering-team-title\":\"Engineering \u0026 Operations\",\"research-annotation-team-title\":\"Research \u0026 Digitization\",\"past-team-members-title\":\"Usul AI Alumni\",\"board-title\":\"Meet the board\",\"board-subtitle\":\"Usul.AI is a project of the Seemore Foundation, whose board comprises distinguished experts in Islamic research and in new technology. Each are leaders in their respective fields, with decades of experience in pioneering the way we access and engage knowledge. Together, they ensure that the organization advances its mission.\",\"board-members\":{\"adnan-zulfiqar\":{\"name\":\"Adnan Zulfiqar\",\"description\":\"He is a Professor of law at Boston College Law School, where he teaches and writes on criminal law and the laws of war. He helped draft the Islamic criminal codes for the Maldives and Somalia.\"},\"intisar-rabb\":{\"name\":\"Intisar Rabb\",\"description\":\"She is a Professor of law and history at Harvard, specializing in criminal law and interpretation (usul al-fiqh). She leads the [Program in Islamic Law](https://pil.law.harvard.edu/) and the [SHARIAsource Lab](https://portal.shariasource.com/) , and [IslamicLawBlog](https://islamiclaw.blog/).\"},\"zeki-mokhtarzada\":{\"name\":\"Zeki Mokhtarzada\",\"description\":\"He is a serial entrepeneur and technology innovator. He has served as CTO to various start-ups and has co-founded multiple ventures, including webs.com (acquired by Vistaprint) and Truebill (now Rocket Money).\"}},\"members\":{\"anas-hassanien\":{\"name\":\"Anas Hassanien\",\"description\":\"He is a software engineer with full-stack experience, who previously served at Simli AI. He leads the development of core products as Usul.AI.\"},\"abtsam-saleh\":{\"name\":\"Abtsam Saleh\",\"description\":\"She is a PhD candidate at Harvard University researching the social dimensions of human-centered technologies. She directs operations and bridges engineering with research at Usul AI.\"},\"ryad-ramo\":{\"name\":\"Ryad Ramo\",\"description\":\"He is a researcher of Islamic knowledge and history, holds a BA in Islamic Studies, and founded the publication the Gems of Al-Andalus. He works on book-digitization and annotation at Usul AI.\"},\"ahmed-aktan\":{\"name\":\"Ahmet Aktan\",\"description\":\"He is a researcher who holds a PhD in Islamic Studies from Al-Azhar University. He leads the digitization team and efforts to expand the collections at Usul AI.\"},\"ismail-safadi\":{\"name\":\"Ismail Safadi\",\"description\":\"He is a researcher who specializes in Hanafi fiqh. He studied at the University of Jordan and in Turkey. He works on book digitization and annotation at Usul AI.\"},\"abdellatif-abdelfattah\":{\"name\":\"Abdellatif Abdelfattah\",\"description\":\"He is an engineer who served as a co-founding engineer at Tarteel AI and our own Usul AI. He previously lead engineering at Quran.com and worked at Twitter.\"},\"ahmed-riad\":{\"name\":\"Ahmed Riad\",\"description\":\"He is a software engineer who served as founding-engineer at at several start-ups (including Remail AI, Betterbook, and our own Usul AI). he also served as an engineer at Qur'an.com.\"},\"mohamed-lamine\":{\"name\":\"Mohamed Lamine\",\"description\":\"Mohamed was the design lead at Thmanyah, he consults with startups to build 0 to 1 products.\"},\"rahma-fateen\":{\"name\":\"Rahma Fateen\",\"description\":\"Rahma lead Arabic localization at Tarteel AI. She was a translator at Human Rights Watch.\"},\"ahmed-khan\":{\"name\":\"Ahmed Khan\",\"description\":\"Ahmed is a student at Zaytuna College. He's the creator of The Creative Minority podcast.\"},\"mohsen-kadivar\":{\"name\":\"Mohsen Kadivar\",\"description\":\"He is a scholar of Islamic law, theology, philosophy as well as a reformist thinker and writer of modern Islamic thought. He formerly taught taught at the Qom Seminary (Madrase-ye Razavieh and Madrase-ye Ayatollah al-Uzma Golpayegani). He is currently a research professor of Islamic Studies at Duke University.\"},\"issam-eido\":{\"name\":\"Issam Eido\",\"description\":\"He is a scholar of Qurʾān, Ḥadīth Studies, and Sufism who formerly served on the faculty of Islamic Studies at the University of Damascus and established the Dalalah Institue for teaching Islamic studies in Syria. He is now an Assistant Professor of the Practice on the faculty of Religious Studies at Vanderbilt University.\"},\"intisar-rabb\":{\"name\":\"Intisar Rabb\",\"description\":\"She is a scholar of Islamic and comparative law, history, and Qurʾānic manuscripts--with emphasis on interpretive methods in legislation and adjudication, using legal canons (Qawāʿid fiqhiyya). She previously lived and studies in Iran, Syria, Egypt, Morocco, Senegal, and elsewhere. She is now a Professor of law and history at Harvard, where she leads the [Program in Islamic Law](https://pil.law.harvard.edu/) and the [SHARIAsource Lab](https://portal.shariasource.com/) , and [IslamicLawBlog](https://islamiclaw.blog/).\"}},\"roles\":{\"ceo\":\"CEO\",\"former-ceo\":\"Former CEO\",\"former-engineer\":\"Former Lead Engineer\",\"researcher\":\"Researcher\",\"research-advisor\":\"Research Advisor\",\"research-lead-advisor\":\"Research Lead, Research Advisor\",\"localization-lead\":\"Localization Lead\",\"digitization-lead\":\"Digitization Lead\",\"head-of-design\":\"Head of Design\",\"software-engineer\":\"Software Engineer\",\"director-of-operations\":\"Director of Operations\"}},\"donate\":{\"hero\":{\"title\":\"Why support Usul AI.\",\"subtitle\":\"Help us build the biggest library, ensure the widest access, and facilitate the boldest research in Islamic knowledge for the 21st century.\",\"description\":\"With your support, Usul has made thousands of historical texts more accessible, reaching tens of thousands of users around the world.\",\"donate-widget\":{\"month-raised\":\"Raised\",\"goal\":\"Goal ${goal, number} Monthly\",\"active-monthly-donors\":\"\u003cstrong\u003e{donors, number}\u003c/strong\u003e active monthly donors\",\"become-a-donor\":\"Become a Donor\"}},\"achievements\":{\"title\":\"Achievements\",\"one\":{\"title\":\"Expanding Access to Islamic Texts\",\"features\":{\"0\":\"Collecting and making accessible in one place over \u003cstrong\u003e15,000\u003c/strong\u003e digitized Islamic sources in PDF and eBook format, with a clean, readable format.\",\"1\":\"Transforming static PDFs into structured, machine-readable formats for easier search and analysis.\"}},\"two\":{\"title\":\"Enhancing Research with AI-Powered Tools\",\"features\":{\"0\":\"Advanced search capabilities that allow users to quickly locate precise information.\",\"1\":\"AI-powered assistants that allow researchers to navigate large volumes of text with ease.\"}},\"three\":{\"title\":\"Enabling Large-Scale Analysis\",\"description\":\"Supporting large-scale, cross-textual analysis that opens new possibilities for Islamic research. Enabling efficient navigation of vast Islamic textual sources by making thousands of credible works searchable at once, researchers can use Usul to trace concepts and patterns across genres with speed and precision.\"}},\"roadmap\":{\"title\":\"\u003cstrong\u003eUsul’s Roadmap\u003c/strong\u003e: Our Vision for the Future\",\"description\":\"Your donations will help us achieve the following goals:\",\"items\":{\"0\":{\"title\":\"AI-Powered Search for Islamic Sources\",\"features\":{\"0\":\"Incorporate state-of-the-art search tools and the latest AI models to enable researchers to quickly locate precise information.\",\"1\":\"Enable efficient navigation of vast Islamic textual sources.\"}},\"1\":{\"title\":\"Curated Islamic Collections\",\"features\":{\"0\":\"Collaborate with leading scholars to develop a representative “core corpus” across all major Islamic fields.\",\"1\":\"Create curated collections tailored to various genres.\"}},\"2\":{\"title\":\"Universal Corpus\",\"features\":{\"0\":\"Build the infrastructure and partnerships with libraries and other online repositories to house a universal, comprehensive corpus of texts in structured digital formats.\",\"1\":\"Ensure that, as the world of online knowledge grows, all works are accessible, searchable, and analyzable.\"}}}},\"be-part\":{\"title\":\"Support Usul’s Mission\",\"description\":\"Your contribution enables the development of short-term research and it sustains the long-term development of innovative tools for Islamic research.\",\"why-support\":{\"title\":\"Why support Usul?\",\"features\":{\"0\":\"Accelerate Islamic research into cutting edge problems of the day that require quick analysis across vast resources–from ethical Islamic AI and governance to how and whether to use AI to produce legal opinions, medical diagnoses, and financial matters\",\"1\":\"Accelerate Islamic education and Islamic knowledge more generally, by building the infrastructure for use in global schools, universities, and courts in need of reliable ‘internal’ or comparative Islamic research tools\",\"2\":\"Play a vital role in shaping the future of how Islam is preserved and studied\"}},\"choose-amount\":{\"title\":\"Choose your donation amount:\",\"interval\":{\"one-time\":\"One Time\",\"monthly\":\"Monthly\",\"yearly\":\"Yearly\"},\"note\":\"Donations are collected by the Seemore Foundation, a 501(c)(3) nonprofit organization (status pending). All donations are tax-deductible in the US. For any inquiries, please contact us at donors@usul.ai.\",\"continue\":\"Continue\"}},\"success\":{\"title\":\"Thank You for Your Donation!\",\"description\":\"Your generosity makes a real difference. We appreciate your support in our mission.\"},\"verification\":{\"title\":\"What's your email?\",\"description\":\"Email is required to send you receipts and donor updates.\",\"sent-code\":\"We've sent a code to your email. Please enter it below to complete the donation.\",\"v
