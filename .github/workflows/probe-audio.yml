name: Probe reciter audio
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-audio.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch word timings for all surahs (Alafasy 7, Yasser 97)
        run: |
          set +e
          mkdir o
          python3 - <<'PY'
          import json, urllib.request, time
          out={}
          for rid in (7,97):
              out[rid]={}
              for s in range(1,115):
                  u=f"https://api.qurancdn.com/api/qdc/audio/reciters/{rid}/audio_files?chapter={s}&segments=true"
                  for t in range(3):
                      try:
                          d=json.load(urllib.request.urlopen(u,timeout=30))['audio_files'][0]; break
                      except Exception as e:
                          time.sleep(2); d=None
                  if not d: out[rid][s]=None; continue
                  out[rid][s]={'url':d['audio_url'],'dur':d.get('duration'),'v':[[vt['verse_key'],vt['timestamp_from'],vt['timestamp_to'],[sg for sg in vt.get('segments') or []]] for vt in d['verse_timings']]}
          json.dump(out,open('o/timings.json','w'))
          PY
          ls -la o
      - name: Save results
        run: |
          cd o && git init -q -b probe && git config user.name a && git config user.email a@b
          git add -A && git commit -qm probe && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
