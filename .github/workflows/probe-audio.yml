name: Probe reciter audio
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-audio.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Drift check
        run: |
          set +e
          sudo apt-get -qq install -y ffmpeg >/dev/null 2>&1; pip -q install numpy
          mkdir -p o; for spec in "7 78" "173 78" "97 78" "3 78" "7 67" "7 36" "3 36" "7 1" "97 67" "3 67" "7 2" "3 112" "7 82" "97 92"; do python3 tools/drift_check.py $spec; done 2>&1 | tee o/drift.txt
      - name: Save results
        run: |
          cd o && rm -rf al && git init -q -b probe && git config user.name a && git config user.email a@b
          git add -A && git commit -qm probe && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
