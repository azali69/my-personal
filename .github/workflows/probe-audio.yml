name: Probe reciter audio
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-audio.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          sudo apt-get -qq install -y ffmpeg >/dev/null 2>&1
          mkdir o w; exec > >(tee o/probe.txt) 2>&1
          UA="Mozilla/5.0"
          echo "== Do verse/word timings fall on pauses in the audio? (low energy = good alignment)"
          for spec in "7 78" "173 78" "7 67" "173 67" "97 78" "3 78"; do set -- $spec; rid=$1; ch=$2
            curl -s -A "$UA" "https://api.qurancdn.com/api/qdc/audio/reciters/$rid/audio_files?chapter=$ch&segments=true" -o w/t.json
            u=$(python3 -c "import json;print(json.load(open('w/t.json'))['audio_files'][0]['audio_url'])"); curl -s -A "$UA" -L -o w/a.mp3 "$u"
            ffmpeg -v error -i w/a.mp3 -ac 1 -ar 8000 -f s16le w/a.raw -y
            frames=$(ffprobe -v error -select_streams a -show_entries packet=size -of csv=p=0 w/a.mp3 | sort -u | wc -l)
            python3 - $rid $ch $frames <<'PY'
          import json,sys,array,math,statistics
          rid,ch,fr=sys.argv[1:]
          d=json.load(open('w/t.json'))['audio_files'][0]; v=d['verse_timings']
          b=array.array('h',open('w/a.raw','rb').read()); sr=8000; hop=80  # 10 ms
          env=[math.sqrt(sum(x*x for x in b[i:i+hop])/hop) for i in range(0,len(b)-hop,hop)]
          med=statistics.median(env)
          def lowest_near(ms,win=600):   # where is the quietest 10ms within +-win of a timestamp?
              c=int(ms/10); lo=max(0,c-win//10); hi=min(len(env)-1,c+win//10); i=min(range(lo,hi+1),key=lambda k:env[k]); return (i-c)*10, env[c]/med
          offs=[]; ratios=[]
          for t in v[1:]:
              o,r=lowest_near(t['timestamp_from']); offs.append(o); ratios.append(r)
          print(f"reciter {rid} surah {ch}: distinct frame sizes {fr} (1-2 = constant bitrate), file {len(b)/sr:.1f}s vs timings end {v[-1]['timestamp_to']/1000:.1f}s")
          print(f"   energy at verse starts vs median: {statistics.median(ratios):.2f}  | quietest point offset from verse start (ms): median {statistics.median(offs):+.0f}, first verses {offs[:6]}, last verses {offs[-6:]}")
          PY
          done
      - name: Save results
        run: |
          cd o && git init -q -b probe && git config user.name a && git config user.email a@b
          git add -A && git commit -qm probe && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
