name: Probe reciter audio
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-audio.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check which surahs exist, and CORS headers
        run: |
          set +e
          exec > >(tee /tmp/probe.txt) 2>&1
          echo "== hazza mp3quran (r1)"; ok=""; miss=""
          for i in $(seq -w 1 114); do n=$(printf "%03d" $((10#$i)));
            c=$(curl -s -o /dev/null -w "%{http_code}" -I "https://server11.mp3quran.net/hazza/$n.mp3"); d=$(curl -s -o /dev/null -w "%{http_code}" -I "https://cdn.mp3quran.net/download/audio/hazza-balushi/r1/$n.mp3")
            if [ "$c" = "200" ] || [ "$d" = "200" ]; then ok="$ok $((10#$i))"; else miss="$miss $((10#$i))"; fi; done
          echo "OK:$ok"; echo "MISSING:$miss"
          echo "== mp3quran API search"; curl -s "https://mp3quran.net/api/v3/reciters?language=eng" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(r['id'],r['name'],[(m['id'],m['name'],m['server'],m['surah_total']) for m in r['moshaf']]) for r in d['reciters'] if 'azza' in r['name'] or 'Balush' in r['name'] or 'Alafasy' in r['name'] or 'Afasy' in r['name']]"
          echo "== everyayah Alafasy"; curl -sI -H "Origin: https://azali69.github.io" https://everyayah.com/data/Alafasy_128kbps/078001.mp3 | grep -i "HTTP/\|access-control\|content-type\|content-length"
          echo "== everyayah hazza?"; for f in Hazza_Al_Balushi_128kbps Hazza_Al-Balushi_128kbps hazza_al_balushi_128kbps; do curl -s -o /dev/null -w "$f %{http_code}\n" -I https://everyayah.com/data/$f/001001.mp3; done
          echo "== quran.com api recitations"; curl -s "https://api.quran.com/api/v4/resources/recitations?language=en" | python3 -c "import sys,json; [print(r) for r in json.load(sys.stdin)['recitations']]"
          echo "== quranicaudio"; curl -s "https://quranicaudio.com/api/qaris" | python3 -c "import sys,json; [print(q.get('id'),q.get('name'),q.get('relative_path')) for q in json.load(sys.stdin) if 'alush' in (q.get('name') or '').lower() or 'afasy' in (q.get('name') or '').lower() or 'hazza' in (q.get('name') or '').lower()]"
          echo "== CORS mp3quran"; curl -sI -H "Origin: https://azali69.github.io" https://server11.mp3quran.net/hazza/078.mp3 | grep -i "HTTP/\|access-control\|content-type"
      - name: Save results
        run: |
          mkdir o && cp /tmp/probe.txt o/ && cd o && git init -q -b probe && git config user.name a && git config user.email a@b
          git add -A && git commit -qm probe && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
