name: Probe reciter audio
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-audio.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Drift check
        run: |
          set +e
          sudo apt-get -qq install -y ffmpeg >/dev/null 2>&1; pip -q install numpy
          mkdir -p o; for rid in 7 173 97 3; do seq 1 114 | xargs -P 6 -I{} python3 tools/drift_check.py $rid {} >> o/drift.txt 2>&1; done
          python3 -c "import json,glob; out={}; [out.setdefault(r['rid'],{}).__setitem__(r['s'],r['w']) for r in (json.load(open(f)) for f in glob.glob('o/dr/*.json'))]; json.dump(out,open('o/drift.json','w')); print({k:len(v) for k,v in out.items()})"
          rm -rf o/dr
      - name: Save results
        run: |
          cd o && rm -rf al && git init -q -b probe && git config user.name a && git config user.email a@b
          git add -A && git commit -qm probe && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
