name: Probe reciter audio
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-audio.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check first and last ayah of every surah
        run: |
          set +e
          exec > >(tee /tmp/probe.txt) 2>&1
          C=(7 286 200 176 120 165 206 75 129 109 123 111 43 52 99 128 111 110 98 135 112 78 118 64 77 227 93 88 69 60 34 30 73 54 45 83 182 88 75 85 54 53 89 59 37 35 38 29 18 45 60 49 62 55 78 96 29 22 24 13 14 11 11 18 12 12 30 52 52 44 28 28 20 56 40 31 50 40 46 42 29 19 36 25 22 17 19 26 30 20 15 21 11 8 8 19 5 8 8 11 11 8 3 9 5 4 7 3 6 3 5 4 5 6)
          for R in MaherAlMuaiqly128kbps Yasser_Ad-Dussary_128kbps; do
            miss=""
            for s in $(seq 1 114); do n=${C[$((s-1))]}
              for a in 1 $n; do u=$(printf "https://everyayah.com/data/%s/%03d%03d.mp3" $R $s $a)
                c=$(curl -s -o /dev/null -w "%{http_code}" -I "$u"); [ "$c" = "200" ] || miss="$miss $s:$a($c)"; done; done
            echo "== $R missing:${miss:- none}"
          done
          curl -sI -H "Origin: https://azali69.github.io" https://everyayah.com/data/Yasser_Ad-Dussary_128kbps/078001.mp3 | grep -i "HTTP/\|access-control-allow-origin"
          curl -sI -H "Origin: https://azali69.github.io" https://everyayah.com/data/MaherAlMuaiqly128kbps/078001.mp3 | grep -i "HTTP/\|access-control-allow-origin"
          echo "== mp3quran"; curl -sL "https://mp3quran.net/api/v3/reciters?language=eng" -o r.json; python3 - <<'PY'
          import json
          d=json.load(open('r.json'))
          for r in d['reciters']:
              nm=r['name'].lower()
              if 'muaiqly' in nm or 'maher' in nm or 'dosari' in nm or 'dossari' in nm or 'yasser' in nm:
                  for m in r['moshaf']: print(r['id'], r['name'], '|', m['name'], m['server'], m['surah_total'])
          PY
          echo "== QUL"; curl -sL "https://qul.tarteel.ai/resources/recitation" | grep -oiE "(Maher|Muaiqly|Mu.aiqly|Yasser|Dossari|Dosari|Dussary)[^<]{0,60}" | sort -u | head
      - name: Save results
        run: |
          mkdir o && cp /tmp/probe.txt o/ && cd o && git init -q -b probe && git config user.name a && git config user.email a@b
          git add -A && git commit -qm probe && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
