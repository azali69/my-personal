name: Update transliteration data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/fetch_translit.py', '.github/workflows/translit-data.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_translit.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translit; git diff --cached --quiet && exit 0
          git commit -qm "Transliteration data from Quran.com [skip ci]" && git pull -q --rebase && git push
