name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          Q1='[out:json][timeout:180];area["ISO3166-1"="SG"][admin_level=2]->.sg;(nwr["amenity"="place_of_worship"]["religion"="muslim"](area.sg););out center tags;'
          Q2='[out:json][timeout:180];area["ISO3166-1"="SG"][admin_level=2]->.sg;(nwr["name"~"[Mm]us[s]?[ao]l+ah|[Ss]urau|[Pp]rayer [Rr]oom|[Mm]asjid|[Mm]osque"](area.sg);nwr["religion"="muslim"](area.sg););out center tags;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            curl -fsS --retry 2 -m 200 --data-urlencode "data=$Q1" $u -o osm1.json && curl -fsS --retry 2 -m 200 --data-urlencode "data=$Q2" $u -o osm2.json && break
          done
          curl -fsS -A "MyPersonalQuran/1.0 (azali69 github)" "https://en.wikipedia.org/w/api.php?action=parse&page=List_of_mosques_in_Singapore&prop=wikitext&format=json" -o wiki.json || true
          curl -fsS -A "MyPersonalQuran/1.0 (azali69 github)" "https://ms.wikipedia.org/w/api.php?action=parse&page=Senarai_masjid_di_Singapura&prop=wikitext&format=json" -o wikims.json || true
          ls -l
          git init -q && git checkout -q -b probe-mosque && git add -A && git -c user.name=probe -c user.email=p@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-mosque
