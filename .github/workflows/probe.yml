name: probe (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml', 'tools/probe_java/H.java']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: |
          cd tools/probe_java && javac H.java && r=$(java H tampines 2>&1 | head -c 1500 | tr '\n' ' ') ; echo "::notice title=java::$r"
