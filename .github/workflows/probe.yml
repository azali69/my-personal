name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out; H='https://hadeethenc.com/api/v1'
          curl -sS -m 60 "$H/languages" -o languages.json || true
          curl -sS -m 60 "$H/hadeeths/one/?language=my&id=2758" -o my.json || true
      - run: |
          cd out; git init -q; git checkout -q -b probe2; git add -A
          git -c user.name=probe -c user.email=probe@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe2
