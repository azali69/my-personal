name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          H='https://hadeethenc.com/api/v1'
          curl -sS -m 60 "$H/languages" -o languages.json || true
          curl -sS -m 60 "$H/categories/list/?language=ms" -o cats-ms.json || true
          curl -sS -m 60 "$H/categories/roots/?language=ms" -o roots-ms.json || true
          curl -sS -m 60 "$H/hadeeths/list/?language=ms&category_id=1&page=1&per_page=5" -o list-ms.json || true
          ID=$(python3 -c "import json;print(json.load(open('list-ms.json'))['data'][0]['id'])" 2>/dev/null || echo 2962)
          curl -sS -m 60 "$H/hadeeths/one/?language=ms&id=$ID" -o one-ms.json || true
          curl -sS -m 60 "$H/hadeeths/one/?language=id&id=$ID" -o one-id.json || true
          curl -sS -m 60 "$H/hadeeths/one/?language=en&id=$ID" -o one-en.json || true
          curl -sS -m 60 "$H/hadeeths/one/?language=ar&id=$ID" -o one-ar.json || true
          curl -sS -m 60 -G "https://dorar.net/dorar_api.json" --data-urlencode "skey=إنما الأعمال بالنيات" -o dorar.json || true
          curl -sS -m 60 -L "https://hadeethenc.com/ms/home/about" -o about-ms.html || true
          curl -sS -m 60 -L "https://zenodo.org/api/records/3082463" -o zenodo.json || true
          ls -la
      - run: |
          cd out; git init -q; git checkout -q -b probe; git add -A
          git -c user.name=probe -c user.email=probe@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
