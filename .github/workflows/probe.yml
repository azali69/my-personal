name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          Q='https://api.quran.com/api/v4'
          curl -sS -m 60 "$Q/resources/tafsirs" -o qc-tafsirs.json || true
          for id in $(python3 -c "import json;print(' '.join(str(t['id']) for t in json.load(open('qc-tafsirs.json'))['tafsirs'] if any(k in (t['name']+t.get('slug','')).lower() for k in ['asbab','nuzul','wahidi','lubab'])))" 2>/dev/null); do
            curl -sS -m 60 "$Q/tafsirs/$id/by_ayah/2:142" -o qc-$id-2-142.json || true
            curl -sS -m 60 "$Q/tafsirs/$id/by_ayah/2:115" -o qc-$id-2-115.json || true
          done
          curl -sS -m 60 "$Q/resources/tafsirs?language=ar" -o qc-tafsirs-ar.json || true
          H='https://hadeethenc.com/api/v1'
          curl -sS -m 60 "$H/hadeeths/one/?language=ms&id=2962" -o he-ms.json || true
          curl -sS -m 60 "$H/hadeeths/one/?language=ar&id=2962" -o he-ar.json || true
          curl -sS -m 60 "$H/hadeeths/list/?language=ms&category_id=1&page=1&per_page=1" -o he-list.json || true
          curl -sS -m 60 -L "https://tafsir.app/api/v1/sources" -o tafsirapp.json || true
          curl -sS -m 60 -L "https://quranenc.com/api/v1/translations/list/ms" -o qe-ms.json || true
          ls -la
      - run: |
          cd out; git init -q; git checkout -q -b probe; git add -A
          git -c user.name=probe -c user.email=probe@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
