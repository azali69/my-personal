name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/fetch_hadeethenc.py out 2>&1 | tee out-log.txt; mv out-log.txt out/log.txt; ls -la out
      - run: |
          cd out; git init -q; git checkout -q -b probe; git add -A
          git -c user.name=probe -c user.email=probe@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
