name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          for c in 1 27 28 37; do curl -sS -m 60 -A "Mozilla/5.0" "https://sunnah.com/hisn/$c" -o hisn_$c.html || true; sleep 2; done
          curl -sS -m 60 -A "Mozilla/5.0" "https://sunnah.com/hisn" -o hisn_index.html || true
          ls -la
      - run: |
          cd out; git init -q; git checkout -q -b probe4; git add -A
          git -c user.name=probe -c user.email=probe@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe4
