name: probe (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml', 'tools/probe.py']
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sources; git diff --cached --quiet && exit 0
          git commit -qm "Source texts for the Prophet's family (Wikisource) [skip ci]" && git pull -q --rebase && git push
