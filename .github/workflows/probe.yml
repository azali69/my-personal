name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          curl -sSL -A "Mozilla/5.0" -o mukhtasar.pdf -w "pdf %{http_code} %{size_download}\n" https://assets.usul.ai/pdfs/4xS8spzC-J.pdf || true
          for i in $(seq 1 330); do
            curl -sSL -A "Mozilla/5.0" -o p$i.html -w "$i %{http_code} %{size_download}\n" "https://usul.ai/t/mukhtasar-shamail-muhammadiyya/$i" >> codes.txt || true
          done
          tail -3 codes.txt
      - run: |
          cd out; git init -q; git checkout -q -b probe-mukh; git add -A
          git -c user.name=probe -c user.email=probe@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-mukh
