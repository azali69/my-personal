name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          curl -sSL -A "$UA" "https://www.muis.gov.sg/mosque/Our-Mosques/Mosque-Directory" -o muis_dir.html -w "%{http_code}\n" || true
          curl -sSL -A "$UA" "https://www.muis.gov.sg/mosque" -o muis_mosque.html -w "%{http_code}\n" || true
          curl -sSL -A "$UA" "https://www.ourmosques.sg/" -o ourmosques.html -w "%{http_code}\n" || true
          npm i playwright@1.47.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > p.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{ const b=await chromium.launch(); const p=await b.newPage();
            for(const [u,f] of [['https://www.muis.gov.sg/mosque/Our-Mosques/Mosque-Directory','muis_dir_pw.html'],['https://www.muis.gov.sg/mosque','muis_mosque_pw.html']]){
              try{ await p.goto(u,{waitUntil:'networkidle',timeout:60000}); await p.waitForTimeout(4000); require('fs').writeFileSync(f, await p.content()); }catch(e){ console.log(u,e.message); } }
            await b.close(); })();
          JS
          node p.js || true
          ls -l
          cd .. && git -C out init -q && git -C out checkout -q -b probe-mosque2 && git -C out add -A && git -C out -c user.name=probe -c user.email=p@x commit -qm probe
          git -C out push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-mosque2
