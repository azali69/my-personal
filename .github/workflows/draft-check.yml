name: Draft compile check (no release)
on:
  push:
    branches: [draft-hadith]
    paths: ['android/**', '.github/workflows/draft-check.yml']
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: |
          mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
          set +e; gradle -p android assembleRelease --no-daemon > build.log 2>&1; code=$?
          tail -n 40 build.log; grep -E -A6 "error:|What went wrong" build.log | head -60; exit $code
