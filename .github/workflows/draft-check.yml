name: Draft compile check (no release)
on:
  push:
    branches: [draft-hadith]
    paths: ['android/**', '.github/workflows/draft-check.yml']
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: |
          mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
          set +e; gradle -p android assembleRelease --no-daemon > build.log 2>&1; code=$?
          echo "::notice::apk $(ls -l android/app/build/outputs/apk/release/*.apk 2>/dev/null | awk '{print $5}')"
          if [ $code -ne 0 ]; then
            msg=$(grep -E -A6 "What went wrong|error:|ERROR|Exception" build.log | head -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
          fi
          exit $code
