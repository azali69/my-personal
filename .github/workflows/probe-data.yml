name: Probe data sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-data.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir o && cd o
          A="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sL -A "$A" -m 60 http://www.hisnmuslim.com/api/en/27.json -o en27.json
          curl -sL -A "$A" -m 60 http://www.hisnmuslim.com/api/ar/27.json -o ar27.json
          curl -sL -A "$A" -m 60 http://www.hisnmuslim.com/api/en/husn_en.json -o en_index.json
          curl -sL -A "$A" -m 60 https://hisnmuslim.com/i/en/27 -o page_en27.html
          curl -sL -A "$A" -m 60 "https://enc.islamhouse.com/api/books/819" -o ih_api.json
          curl -sL -A "$A" -m 60 "https://enc.islamhouse.com/ms/books/819/1" -o ih_ms.html
          curl -sL -A "$A" -m 60 "https://enc.islamhouse.com/id/books/819/1" -o ih_id.html
          curl -sL -A "$A" -m 60 "https://enc.islamhouse.com/en/books/819" -o ih_en_index.html
          ls -la
          git init -q -b probe && git config user.name a && git config user.email a@b && git add -A && git commit -qm probe && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
