name: Update word-by-word data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/fetch_wbw.py', '.github/workflows/wbw-data.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_wbw.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wbw; git diff --cached --quiet && exit 0
          git commit -qm "Word-by-word data from Quran.com [skip ci]" && git pull -q --rebase && git push
