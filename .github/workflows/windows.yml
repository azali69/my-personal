name: Build Windows app
# My Personal Qur'an for Windows: index.html in a WebView2 window (Tauri), as a per-user installer (no admin rights needed).
# Same version as the APK: after "Build Android APK" succeeds, the installer is added to that same release (v<major>.<minor>.<patch>.<build>).
# Changes under desktop/ build and test it without making a release.
on:
  workflow_run:
    workflows: ['Build Android APK']
    types: [completed]
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      RUN_NO: ${{ github.event.workflow_run.run_number || github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Version
        run: |
          BASE=$(tr -d '[:space:]' < VERSION)
          echo "BASE=$BASE" >> $GITHUB_ENV
          echo "V=$BASE.$RUN_NO" >> $GITHUB_ENV
      - name: Put the web app in the window
        run: |
          mkdir -p desktop/www
          cp index.html icon-192.png icon-512.png manifest.webmanifest desktop/www/
          grep -o 'id="whereS">v[0-9.]*' index.html
      - name: Install the build tool
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build the Windows installer
        working-directory: desktop/src-tauri
        run: node ../node_modules/@tauri-apps/cli/tauri.js build --config "{\"version\":\"${BASE}\"}" 2>&1 | tee ../../tauri.log; exit ${PIPESTATUS[0]}
      - name: Keep the build log on the ci-diag-win branch if the build fails
        if: failure()
        run: |
          mkdir wdiag && tail -300 tauri.log > wdiag/tauri-tail.txt; grep -nE "error|warning: unused" tauri.log | tail -200 > wdiag/errors.txt || true
          cd wdiag && git init -q -b ci-diag-win && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -q -m "run ${{ github.run_number }}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-diag-win
      - name: Name the installer
        run: |
          ls -la desktop/src-tauri/target/release/bundle/nsis/
          cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe "My-Personal-Quran-v${V}-Windows-setup.exe"
          ls -la My-Personal-Quran-v${V}-Windows-setup.exe
      - name: Install it silently, open it and check the app
        timeout-minutes: 12
        run: |
          export MSYS2_ARG_CONV_EXCL="*"   # Git Bash must not turn the installer flag /S into a path
          export MPQ_DEBUG_PORT=9222   # lets the test driver look into the window (see main.rs)
          SETUP="./My-Personal-Quran-v${V}-Windows-setup.exe"
          echo "--- WebView2 runtime on this machine"
                              echo "--- install"
          cp "$SETUP" qsetup.exe
          ("./qsetup.exe" /S > setup.log 2>&1 &) ; INST_OK=0
          for i in $(seq 1 40); do sleep 3; if ! tasklist | grep -qi "qsetup"; then INST_OK=1; echo "installer finished after ~$((i*3))s"; break; fi; done
          if [ "$INST_OK" = 0 ]; then
            echo "installer still running after 120s; processes:"
            powershell -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.Name -match 'qsetup|setup|webview|nsis|cmd|find|tasklist|taskkill|my-personal|msedge|conhost' } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List | Out-String -Width 300"
            mkdir -p shots
            powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; \$b=[System.Windows.Forms.SystemInformation]::VirtualScreen; \$bmp=New-Object System.Drawing.Bitmap \$b.Width,\$b.Height; \$g=[System.Drawing.Graphics]::FromImage(\$bmp); \$g.CopyFromScreen(\$b.Location,[System.Drawing.Point]::Empty,\$b.Size); \$bmp.Save('shots/desktop-while-installing.png')"
            ls -la "$LOCALAPPDATA" | grep -i qur; cat setup.log | head -20
            taskkill //F //IM qsetup.exe > /dev/null 2>&1
            exit 1
          fi
          sleep 3
          find "$LOCALAPPDATA" -maxdepth 3 \( -name '*.exe' \) | head
          EXE=$(find "$LOCALAPPDATA" -maxdepth 3 -name 'my-personal-quran.exe' | head -1); echo "installed: $EXE"; test -n "$EXE"
          MARK="ci-$(date +%s)"
          echo "--- first launch"; ("$EXE" > app1.log 2>&1 &) ; sleep 6; tasklist | grep -i my-personal-quran || echo "(app is not running)"
          echo "--- webview processes and ports"; sleep 4
          powershell -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.Name -match 'my-personal|msedgewebview2' } | Select-Object ProcessId,Name,@{n='Cmd';e={\$_.CommandLine.Substring(0,[Math]::Min(\$_.CommandLine.Length,420))}} | Format-List | Out-String -Width 500" | head -60
          netstat -ano | grep -E "LISTENING" | grep -E "9222|127.0.0.1" | head; cat app1.log | head -20
          timeout 240 node desktop/ci-smoke.mjs 1 shots "$MARK"; R1=$?
          echo "--- install the same version again while the app is open (an update)"
          ("./qsetup.exe" /S > setup2.log 2>&1 &) ; for i in $(seq 1 40); do sleep 3; if ! tasklist | grep -qi "qsetup"; then echo "installer finished after ~$((i*3))s"; break; fi; done
          tasklist | grep -i my-personal-quran || echo "(app was closed by the installer)"
          taskkill //F //IM my-personal-quran.exe > /dev/null 2>&1 || true; sleep 2
          echo "--- launch again after the update"; ("$EXE" > app2.log 2>&1 &) ; sleep 6
          timeout 180 node desktop/ci-smoke.mjs 2 shots "$MARK"; R2=$?
          taskkill //F //IM my-personal-quran.exe > /dev/null 2>&1 || true
          UN=$(find "$LOCALAPPDATA" -maxdepth 3 -name 'uninstall.exe' | head -1); echo "uninstaller: $UN"; test -n "$UN"
          echo "results: first=$R1 after-update=$R2"; test "$R1" = 0 && test "$R2" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-checks
          path: shots/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: My-Personal-Quran-v${{ env.V }}-Windows-setup.exe
      - name: Add the installer to the release
        if: github.event_name == 'workflow_run'
        run: gh release upload "v${V}" "My-Personal-Quran-v${V}-Windows-setup.exe" --clobber --repo "${{ github.repository }}"
