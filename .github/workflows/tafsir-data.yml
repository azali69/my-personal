name: Update tafsir data
on:
  workflow_dispatch:
  schedule: [{cron: '17 3 1 * *'}]   # monthly: QuranEnc asks re-publishers to keep the latest version
  push:
    branches: [main]
    paths: ['tools/fetch_tafsir.py', '.github/workflows/tafsir-data.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_tafsir.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tafsir
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -qm "Tafsir data from QuranEnc.com [skip ci]" && git pull -q --rebase && git push
