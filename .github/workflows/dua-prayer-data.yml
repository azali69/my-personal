name: Update dua and prayer data
on:
  workflow_dispatch:
  schedule: [{cron: '23 2 2 * *'}]   # monthly: picks up next year's MUIS timetable when it is published
  push:
    branches: [main]
    paths: ['tools/fetch_dua_prayer.py', '.github/workflows/dua-prayer-data.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_dua_prayer.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dua prayer; git diff --cached --quiet && exit 0
          git commit -qm "Dua and prayer data [skip ci]" && git pull -q --rebase && git push
