name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the web app inside the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/My-Personal-Quran-v1.0-build${{ github.run_number }}.apk"
          sha256sum out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: My Personal Quran v1.0 (build ${{ github.run_number }})
          make_latest: true
          files: out/*.apk
          body: |
            Android app for My Personal Quran v1.0.

            Install: download the .apk on your phone and open it. Android will ask you to allow installs from this source the first time.
            Updates install over the previous version, keeping your blocks and hafazan history.
