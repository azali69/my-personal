name: MUIS khutbah
on:
  schedule:
    - cron: '17 11 * * 4'   # Thursday 19:17 Singapore
    - cron: '17 23 * * 4'   # Friday 07:17 Singapore
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_khutbah.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add khutbah/latest.json
          git diff --cached --quiet || (git commit -m "MUIS khutbah: latest [skip ci]" && git push)
