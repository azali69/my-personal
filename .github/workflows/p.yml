name: probe-ocr2
on: { push: { branches: [probe-ocr2] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          set +e
          mkdir -p out
          pip install easyocr onnx onnxscript onnxruntime rapidocr_onnxruntime scipy > out/pip.txt 2>&1; echo "pip $?" >> out/pip.txt
          python export.py > out/export.txt 2>&1
          python pipe.py out/ar_rec.onnx > out/pipe_fp32.txt 2>&1
          python pipe.py out/ar_rec_q.onnx > out/pipe_q.txt 2>&1
          cp $(python -c "import rapidocr_onnxruntime as R,glob,os;print(glob.glob(os.path.join(os.path.dirname(R.__file__),'models','*det*.onnx'))[0])") out/det.onnx
          ls -la out > out/sizes.txt
          mkdir -p small; cp out/*.txt out/*.json small/ 2>/dev/null
          git config user.name probe; git config user.email p@x; git add -f small; git commit -qm out; git push -q origin HEAD:probe-ocr2-out -f
      - uses: actions/upload-artifact@v4
        with: { name: models, path: out/*.onnx }
